<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姣忔棩椋熻氨 - 5鑿?姹?/title>
<style>
:root {
  --primary: #4CAF50;
  --primary-light: #C8E6C9;
  --primary-dark: #388E3C;
  --bg: #F5F7FA;
  --card-bg: #FFFFFF;
  --text: #333333;
  --text-secondary: #666666;
  --text-light: #999999;
  --border: #E8ECF1;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 25px rgba(0,0,0,0.12);
  --tag-bg: #E8F5E9;
  --tag-text: #2E7D32;
  --badge-meat: #FF6B6B;
  --badge-veg: #4CAF50;
  --badge-soup: #FFA726;
  --modal-overlay: rgba(0,0,0,0.5);
  --accent: #FF7043;
  --radius: 16px;
  --radius-sm: 8px;
  --transition: 0.3s ease;
}
[data-theme="orange"] {
  --primary: #FF7043; --primary-light: #FFE0B2; --primary-dark: #E64A19;
  --tag-bg: #FFF3E0; --tag-text: #E65100; --accent: #FFA726;
}
[data-theme="blue"] {
  --primary: #42A5F5; --primary-light: #BBDEFB; --primary-dark: #1E88E5;
  --tag-bg: #E3F2FD; --tag-text: #1565C0; --accent: #5C6BC0;
}
[data-theme="purple"] {
  --primary: #7E57C2; --primary-light: #D1C4E9; --primary-dark: #512DA8;
  --tag-bg: #EDE7F6; --tag-text: #4527A0; --accent: #E91E63;
}
[data-theme="warm"] {
  --primary: #8D6E63; --primary-light: #D7CCC8; --primary-dark: #5D4037;
  --bg: #FAF8F5; --card-bg: #FFFDF9; --tag-bg: #EFEBE9; --tag-text: #4E342E; --accent: #BF360C;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  transition: background var(--transition), color var(--transition); line-height: 1.6;
}
header {
  background: var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  position: sticky; top:0; z-index:100;
  transition: background var(--transition);
}
.header-inner {
  max-width:1200px; margin:0 auto; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.logo { font-size:26px; font-weight:700; color:var(--primary); transition:color var(--transition); white-space:nowrap; }
.header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.date-badge {
  background:var(--primary-light); color:var(--primary-dark); padding:6px 14px;
  border-radius:20px; font-size:14px; font-weight:500;
  transition:background var(--transition),color var(--transition); white-space:nowrap;
}
.theme-picker { display:flex; gap:6px; align-items:center; }
.theme-dot {
  width:28px; height:28px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; transition:transform var(--transition),border-color var(--transition);
}
.theme-dot:hover { transform:scale(1.15); }
.theme-dot.active { border-color:var(--text); transform:scale(1.1); }
.theme-dot.green { background:#4CAF50; }
.theme-dot.orange { background:#FF7043; }
.theme-dot.blue { background:#42A5F5; }
.theme-dot.purple { background:#7E57C2; }
.theme-dot.warm { background:#8D6E63; }
.cal-btn {
  background:var(--primary); color:#fff; border:none; padding:8px 18px;
  border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:background var(--transition),transform var(--transition); white-space:nowrap;
}
.cal-btn:hover { background:var(--primary-dark); transform:translateY(-1px); }
.today-btn {
  background:transparent; color:var(--primary); border:1.5px solid var(--primary);
  padding:8px 18px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:all var(--transition); white-space:nowrap; display:none;
}
.today-btn:hover { background:var(--primary-light); }

main { max-width:1200px; margin:0 auto; padding:24px; }
.date-heading { text-align:center; font-size:22px; font-weight:600; color:var(--text); margin-bottom:4px; }
.daily-subtitle { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:28px; }
.recipe-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:start; }
@media (max-width:1024px) { .recipe-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:640px) { .recipe-grid { grid-template-columns:1fr; } }
.recipe-card {
  background:var(--card-bg); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); transition:box-shadow var(--transition),transform var(--transition),background var(--transition);
  cursor:pointer; display:flex; flex-direction:column; position:relative;
}
.recipe-card.expanded { overflow:visible; z-index:10; }
.recipe-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-3px); }
.card-img-wrap {
  position:relative; width:100%; padding-top:56%;
  background:var(--primary-light); transition:background var(--transition);
  overflow:hidden;
}
.card-img {
  position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:cover; transition:transform var(--transition);
}
.recipe-card:hover .card-img { transform:scale(1.08); }
.card-icon {
  position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  font-size:72px; line-height:1;
  transition:transform var(--transition);
}
.recipe-card:hover .card-icon:not([style*="display:none"]) { transform:scale(1.15); }
.card-category {
  position:absolute; top:12px; left:12px; padding:4px 12px;
  border-radius:12px; font-size:12px; font-weight:600; color:#fff; z-index:1;
}
.cat-meat { background:var(--badge-meat); }
.cat-veg { background:var(--badge-veg); }
.cat-soup { background:var(--badge-soup); }
.card-body { padding:16px 18px 0; }
.card-name { font-size:18px; font-weight:600; margin-bottom:4px; color:var(--text); }
.card-desc { font-size:13px; color:var(--text-secondary); margin-bottom:8px; line-height:1.5; }
.card-meta { display:flex; gap:16px; font-size:12px; color:var(--text-light); }
.card-expand { display:none; }
.recipe-card.expanded .card-expand {
  display:block; position:absolute; top:100%; left:0; right:0;
  background:var(--card-bg); border-radius:0 0 var(--radius) var(--radius);
  box-shadow:0 10px 25px rgba(0,0,0,0.15); max-height:360px; overflow-y:auto;
  padding:16px 18px; z-index:10; border-top:1px solid var(--border);
}
.card-expand h4 { font-size:13px; color:var(--primary); margin:10px 0 4px; transition:color var(--transition); }
.card-expand h4:first-child { margin-top:0; }
.card-expand ul { list-style:none; padding-left:0; }
.card-expand ul li { font-size:13px; color:var(--text-secondary); padding:2px 0 2px 14px; position:relative; }
.card-expand ul li::before { content:"鈥?; position:absolute; left:0; color:var(--primary); transition:color var(--transition); }
.card-expand ol { padding-left:18px; }
.card-expand ol li { font-size:13px; color:var(--text-secondary); padding:2px 0; line-height:1.6; }
.card-toggle { text-align:center; color:var(--primary); font-size:13px; cursor:pointer; padding:12px 18px 14px; user-select:none; transition:color var(--transition); }
.card-toggle:hover { opacity:0.7; }
.recipe-card.soup-card { border:2px solid var(--badge-soup); position:relative; }
.recipe-card.soup-card::before {
  content:"浠婃棩姹ゅ搧";
  position:absolute; top:8px; right:12px; z-index:1;
  background:var(--badge-soup); color:#fff; padding:2px 10px;
  border-radius:10px; font-size:11px; font-weight:600;
}
.refresh-btn {
  background:transparent; color:var(--accent); border:1.5px solid var(--accent);
  padding:8px 18px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:all var(--transition); white-space:nowrap;
}
.refresh-btn:hover { background:var(--accent); color:#fff; transform:translateY(-1px); }
.refresh-btn:active { transform:scale(0.95); }
.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:var(--modal-overlay); z-index:200; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.active { display:flex; }
.modal {
  background:var(--card-bg); border-radius:var(--radius); max-width:600px; width:100%;
  max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); transition:background var(--transition);
}
.modal-header {
  padding:20px 24px; border-bottom:1px solid var(--border); display:flex;
  justify-content:space-between; align-items:center; position:sticky; top:0;
  background:var(--card-bg); z-index:1; transition:background var(--transition),border-color var(--transition);
}
.modal-header h3 { font-size:18px; color:var(--text); }
.modal-close {
  width:32px; height:32px; border:none; background:var(--border); border-radius:50%;
  cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); transition:background var(--transition);
}
.modal-close:hover { background:#ddd; }
.modal-body { padding:20px 24px; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-nav button {
  background:transparent; border:1px solid var(--border); padding:6px 14px;
  border-radius:var(--radius-sm); cursor:pointer; font-size:16px; color:var(--text);
  transition:all var(--transition);
}
.cal-nav button:hover { background:var(--primary-light); }
.cal-nav button:disabled { opacity:0.3; cursor:not-allowed; }
.cal-nav .cal-month-label { font-size:16px; font-weight:600; color:var(--text); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.cal-day-header { font-size:12px; color:var(--text-light); padding:8px 0; font-weight:600; }
.cal-day {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--radius-sm); cursor:pointer; font-size:14px; transition:all var(--transition);
  position:relative; border:1px solid transparent;
}
.cal-day:hover { background:var(--primary-light); }
.cal-day.today { border-color:var(--primary); font-weight:700; color:var(--primary); }
.cal-day.has-recipe { background:var(--tag-bg); font-weight:600; }
.cal-day.has-recipe::after { content:""; width:5px; height:5px; background:var(--primary); border-radius:50%; position:absolute; bottom:4px; }
.cal-day.other-month { color:#ccc; cursor:default; }
.cal-day.future { color:#ccc; cursor:default; pointer-events:none; }
.cal-day.selected { background:var(--primary); color:#fff; }
.cal-recipes { margin-top:16px; border-top:1px solid var(--border); padding-top:16px; transition:border-color var(--transition); }
.cal-recipes h4 { font-size:15px; margin-bottom:10px; color:var(--text); }
.cal-recipe-item {
  padding:10px 14px; background:var(--bg); border-radius:var(--radius-sm);
  margin-bottom:8px; cursor:pointer; transition:background var(--transition);
  display:flex; align-items:center; gap:10px;
}
.cal-recipe-item:hover { filter:brightness(0.96); }
.cal-recipe-item .cal-recipe-badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
.cal-recipe-item .cal-recipe-name { font-size:14px; color:var(--text); font-weight:500; }
footer { text-align:center; padding:32px 24px; color:var(--text-light); font-size:13px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.recipe-card { animation:fadeIn 0.4s ease forwards; }
.recipe-card:nth-child(1) { animation-delay:0.05s; }
.recipe-card:nth-child(2) { animation-delay:0.10s; }
.recipe-card:nth-child(3) { animation-delay:0.15s; }
.recipe-card:nth-child(4) { animation-delay:0.20s; }
.recipe-card:nth-child(5) { animation-delay:0.25s; }
.recipe-card:nth-child(6) { animation-delay:0.30s; }
@media (max-width:640px) {
  .header-inner { padding:12px 16px; }
  .logo { font-size:20px; }
  .header-right { gap:8px; }
  main { padding:16px; }
  .recipe-grid { gap:14px; }
  .date-heading { font-size:18px; }
  .card-name { font-size:16px; }
}
/* search */
.search-wrap { position:relative; display:flex; align-items:center; }
.search-icon { position:absolute; left:10px; font-size:14px; pointer-events:none; }
.search-input {
  width:150px; padding:7px 12px 7px 30px; border:1.5px solid var(--border);
  border-radius:20px; font-size:13px; outline:none; background:var(--card-bg); color:var(--text);
  transition:all var(--transition);
}
.search-input:focus { width:200px; border-color:var(--primary); }
.search-input::placeholder { color:var(--text-light); }
.search-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:var(--modal-overlay); z-index:150; justify-content:center; align-items:flex-start;
  padding:100px 20px 20px; overflow-y:auto;
}
.search-overlay.active { display:flex; }
.search-panel {
  background:var(--card-bg); border-radius:var(--radius); max-width:700px; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.2); transition:background var(--transition);
  overflow:hidden;
}
.search-result-item {
  display:flex; align-items:center; gap:12px; padding:14px 20px;
  cursor:pointer; transition:background var(--transition); border-bottom:1px solid var(--border);
}
.search-result-item:last-child { border-bottom:none; }
.search-result-item:hover { background:var(--primary-light); }
.search-result-item .sri-icon { font-size:32px; width:44px; text-align:center; flex-shrink:0; }
.search-result-item .sri-info { flex:1; min-width:0; }
.search-result-item .sri-name { font-size:16px; font-weight:600; color:var(--text); }
.search-result-item .sri-desc { font-size:12px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-result-item .sri-meta { display:flex; gap:10px; font-size:12px; color:var(--text-light); margin-top:4px; }
.search-panel-header {
  padding:16px 20px; border-bottom:1px solid var(--border); display:flex;
  justify-content:space-between; align-items:center;
  transition:border-color var(--transition);
}
.search-panel-header h3 { font-size:16px; color:var(--text); }
.search-panel-close {
  width:28px; height:28px; border:none; background:var(--border); border-radius:50%;
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary);
}
.search-panel-close:hover { background:#ddd; }
.search-empty { text-align:center; padding:40px 20px; color:var(--text-light); font-size:14px; }
.search-detail {
  padding:20px 24px;
}
.search-detail .sd-back {
  display:inline-block; margin-bottom:12px; color:var(--primary); cursor:pointer; font-size:13px;
}
.search-detail .sd-back:hover { opacity:0.7; }
.search-detail .sd-name { font-size:20px; font-weight:600; color:var(--text); margin-bottom:4px; }
.search-detail .sd-desc { font-size:14px; color:var(--text-secondary); margin-bottom:12px; }
.search-detail .sd-meta { display:flex; gap:16px; font-size:13px; color:var(--text-light); margin-bottom:16px; }
.search-detail h4 { font-size:14px; color:var(--primary); margin:12px 0 4px; }
.search-detail h4:first-child { margin-top:0; }
.search-detail ul { list-style:none; padding-left:0; }
.search-detail ul li { font-size:13px; color:var(--text-secondary); padding:2px 0 2px 14px; position:relative; }
.search-detail ul li::before { content:"鈥?; position:absolute; left:0; color:var(--primary); }
.search-detail ol { padding-left:18px; }
.search-detail ol li { font-size:13px; color:var(--text-secondary); padding:2px 0; line-height:1.6; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">姣忔棩椋熻氨</div>
    <div class="header-right">
      <span class="date-badge" id="dateBadge"></span>
      <div class="theme-picker" id="themePicker">
        <span style="font-size:12px;color:var(--text-light);margin-right:2px;">涓婚</span>
        <div class="theme-dot green active" data-theme="default" title="娓呮柊缁?></div>
        <div class="theme-dot orange" data-theme="orange" title="娓╂殩姗?></div>
        <div class="theme-dot blue" data-theme="blue" title="绠€绾﹁摑"></div>
        <div class="theme-dot purple" data-theme="purple" title="浼橀泤绱?></div>
        <div class="theme-dot warm" data-theme="warm" title="缁忓吀妫?></div>
      </div>
      <div class="search-wrap">
        <input class="search-input" id="searchInput" placeholder="鎼滅储鑿滆氨..." autocomplete="off">
        <span class="search-icon">馃攳</span>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="鍒锋柊浠婃棩鑿滆氨">馃攧 鎹竴鎹?/button>
      <button class="today-btn" id="todayBtn" title="鍥炲埌浠婂ぉ">浠婂ぉ</button>
      <button class="cal-btn" id="calBtn">馃搮 鍘嗗彶椋熻氨</button>
    </div>
  </div>
</header>

<main>
  <h2 class="date-heading" id="dateHeading"></h2>
  <p class="daily-subtitle" id="dailySubtitle"></p>
  <div class="recipe-grid" id="recipeGrid"></div>
</main>

<footer>姣忔棩鏂伴矞鎼厤锛屽ソ濂藉悆楗?/footer>

<div class="modal-overlay" id="calOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>鍘嗗彶椋熻氨</h3>
      <button class="modal-close" id="calClose">鉁?/button>
    </div>
    <div class="modal-body">
      <div class="cal-nav">
        <button id="calPrev">鈼€</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button id="calNext">鈻?/button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-recipes" id="calRecipes">
        <p style="color:var(--text-light);text-align:center;padding:20px 0;">鐐瑰嚮鏃ユ湡鏌ョ湅褰撳ぉ椋熻氨</p>
      </div>
    </div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel" id="searchPanel"></div>
</div>

<script>
// ============ RECIPES DATA ============
var RECIPES = [
  { id:1, name:"超级鲜美的鸡汤豆腐串 最后连烧烤和鸡汤都有了", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备一大张干豆腐，不是豆腐皮，也不是千张，是东北的干豆腐。", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0721/072137347079.jpg", mainIngredients:["干豆腐 1大张", "鸡骨架 1只", "葱 姜 ", "桂皮 八角 香叶 ", "烧烤酱，烧烤料，辣椒粉，白芝麻 "], seasonings:["料酒 ", "盐 ", "蒜蓉辣酱 ", "香菜 ", "白胡椒粉 "], steps:["准备一大张干豆腐，不是豆腐皮，也不是千张，是东北的干豆腐。", "用刀切成5-6厘米的方块，大小没有影响，看自己喜好吧。", "准备竹签若干，要清洗干净，热水消毒后晾干。买来的竹签一般都不太干净，不建议直接使用。", "干豆腐如图对角卷起，松紧随意一些就好。", "卷好后穿入竹签，小心不要伤到手。", "我这一串穿了五个，根据竹签大小自行调整，干豆腐全部穿好备用。", "鸡骨架一只，去除多余脂肪，剪成两半。锅子足够大的可以整只煮。", "鸡骨架冷水下锅，加入姜片，葱段，料酒，千万不要盖锅盖，利于散去腥味。", "大火煮开后捞出鸡骨架，用流水冲洗干净。", "锅内重新加入冷水，下鸡骨架，葱段，姜片，八角，桂皮，香叶，料酒。有时间的最好先把调料煮开后再加鸡骨架煮开。", "盖盖子大火煮开后转中火，下豆腐串，加少许盐，不要多，后面会用辣椒酱调味，继续煮15分钟。", "时间到，豆腐串捞入碗中，加入少许汤，撒白胡椒粉，香菜末，蒜蓉辣酱。", "辣酱是天津利民的蒜蓉辣酱，很好吃，和豆腐串很相配，很多烧烤店都用这个。", "吃的时候为了方便可以撸下来，干豆腐已经煮定型了，不会散开的。", "来一张美美的定妆照！真的超级鲜美啊，完全就是小时候的味道。", "撒烧烤料，辣椒粉，白芝麻。没有混合好的烧烤料可以分别撒孜然粉，椒盐粉，鸡精，胡椒粉，花生碎也很香，不吃辣可以不加辣椒粉。", "烤箱提前预热10分钟，200℃烤15分钟，具体时间可以看干湿程度自己调节。", "时间到，出炉，满屋烧烤的香气，口水直流啊。生烤和熟烤的口感是有一些差别的，这个就是顺便烤了一下，做法简化，也比较省时间。", "最后只剩下了鸡汤，虽然熬制时间不久，算不上真正意义上的高汤，但也十分鲜美，我装在了这种一次性冰格里面，冷冻保存，平时煮馄饨扔两块很不错，煮菜加几块可以当作高汤使用，比清水鲜美浓郁。"] },
  { id:2, name:"凉拌黄豆芽", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备好黄豆芽。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201512/1409/140923462600.jpg", mainIngredients:["黄豆芽 400克"], seasonings:["葱 适量", "香菜 适量", "蒜 2瓣", "生抽 2勺", "醋 3勺", "香油 1勺", "糖 1勺", "盐 1茶匙", "鸡精 适量", "辣椒面 适量", "芝麻 适量", "油 适量"], steps:["准备好黄豆芽。", "锅中烧开水，把黄豆芽放进去焯一下捞出过凉水，沥干水份备用。", "葱切丝，蒜切成蒜末，香菜切小段。", "把以上食材放入一个大点的容器中。", "放入2勺生抽、3勺醋、1勺糖、1勺香油。", "再放入一茶匙盐和适量鸡精。", "最上面放上辣椒面和芝麻。", "锅中放适量油烧热，浇倒在辣椒面和芝麻上爆出香味。", "带上一次性手套抓拌均匀。", "装盘。"] },
  { id:3, name:"水煮肉片", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"准备食材，瘦肉洗净。大白菜摘几片叶子洗净，撕大片。金针菇去根部洗净，豆芽洗净。葱姜蒜头，蒜...", image:"https://s1.cdn.jiaonizuocai.com/caipu/201512/0718/071813278309.jpg", mainIngredients:["猪瘦肉 400克", "金针菇 150克", "黄豆芽 150克", "白菜 3片", "小红辣椒 10个", "香葱 2棵", "蒜头 5瓣", "邯郸豆瓣酱 2勺", "蛋清 1个", "蒜苗 2棵", "麻油 适量"], seasonings:["姜 1块", "食用油 适量", "老抽 1勺", "蚝油 1勺", "生抽 1勺", "辣椒油 2勺", "花椒 20粒", "八角 1个", "生粉 3勺", "盐 适量", "五香粉 少许"], steps:["准备食材，瘦肉洗净。大白菜摘几片叶子洗净，撕大片。金针菇去根部洗净，豆芽洗净。葱姜蒜头，蒜苗，小红辣椒摘洗干净。", "瘦肉全部切好放入盘子里备用。", "一个鸡蛋只要蛋清，蛋清里加入3勺生粉。拌匀。", "倒在肉片上面，再放入盐，酱油，生抽，五香粉再加入一点清水用手抓匀，腌制5分钟。", "锅里水烧滚，依次放入白菜，黄豆芽，金针菇绰水。白菜煮1分钟，黄豆芽煮1分钟，金针菇煮30秒。", "准备一个大碗，绰好的青菜沥干水放到碗底。", "锅烧7成热倒入适量多的油，放入盘子里腌制好的肉片，用锅铲推散开，中火炸5分钟，不要炸过了。肉片全部炸变色再少炸一下就可以啦。", "炸好的肉片倒入盘子里备用，多余的油倒回油锅里。锅底剩少许油备用。", "葱切花，蒜瓣，姜，蒜苗切碎，小红辣椒5个切圈，留几个一会摆盘。", "拿一个小碗，倒入2勺邯郸豆瓣酱，一勺蚝油，2勺辣椒油，一勺老抽，拌匀。", "锅里油接着烧热，倒入小碗里调好的酱汁炒一下。", "放入之前切好的姜蒜沫，红辣椒圈，花椒，八角，炒出香味红油。", "倒入1大碗高汤，没有高汤开水也可以，接着煮沸。", "倒入盘子里炸好的肉片再煮沸3分钟。", "倒入刚才放有青菜的大碗里，浇入少量麻油，葱花放到中间，小红辣椒摆几个，蒜苗碎均匀撒一些，水煮肉片就做好了，开始吃吧。"] },
  { id:4, name:"青椒炒香干", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"备好图中食材。青椒、红辣椒、香干、蒜洗净。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201601/1423/142311289537.jpg", mainIngredients:["香干 8小块", "青椒 5个", "红辣椒 半个"], seasonings:["油 适量", "盐 少许", "生抽 1汤勺", "胡椒粉 半茶匙", "白糖 半茶匙", "味精 少许", "蒜 3瓣"], steps:["备好图中食材。青椒、红辣椒、香干、蒜洗净。", "青椒、红辣椒切丝，香干切粗条、蒜切片。", "锅里水烧开，放入香干焯水2分钟。", "捞出控干水。", "锅里放油烧热，加入蒜片爆香。", "倒入青椒丝、红辣椒丝炒至七八分熟。", "倒进香干翻炒。", "加入生抽、胡椒粉、白糖炒均匀。", "加盐、味精调味炒匀。", "盛入盘、即食。"] },
  { id:5, name:"鲍鱼鸡汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备4个鲍鱼（杀鲍鱼时保留壳，鲍鱼的边边拿牙刷洗干净，这个是没洗过的图）", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0714/071411529032.jpg", mainIngredients:["鲍鱼 4个", "红枣 4", "黄芪 10克左右"], seasonings:["鸡 半边", "盐 一小勺"], steps:["准备4个鲍鱼（杀鲍鱼时保留壳，鲍鱼的边边拿牙刷洗干净，这个是没洗过的图）", "放入鲍鱼壳先煮15分钟", "放红枣黄芪煮沸", "放入鸡块（准备鸡肉时去掉一下特别油的皮）", "煮沸，拿勺子捞一下油", "按个人放入小勺盐"] },
  { id:6, name:"西红柿蟹菇汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备食材", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0418/04180358158.jpg", mainIngredients:["蟹王菇 100g", "西红柿 1个", "鸡蛋 2个", "木耳 少许"], seasonings:["淀粉 少许"], steps:["准备食材", "锅底放油", "炒一下西红柿，和蟹王菇", "锅中加水，开锅下入淀粉，和鸡蛋"] },
  { id:7, name:"超嫩鸡蛋羹 挑食的宝宝也爱吃", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"鸡蛋两个打散。", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0622/062206167479.jpg", mainIngredients:["鸡蛋 两个", "温水 小半碗"], seasonings:["盐 少许", "生抽 少许", "香油 少许"], steps:["鸡蛋两个打散。", "温水和鸡蛋比例1:1，温水里加盐化开。", "温盐水倒入鸡蛋液搅拌均匀，撇去浮沫。", "用保鲜膜密封。", "水烧开后大火蒸8分钟。", "滑滑嫩嫩的鸡蛋羹做好了，淋上少许生抽,香油就可以美美的吃了，"] },
  { id:8, name:"番茄鱼片汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"番茄热水烫去皮，切成小块。", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0713/071312073564.jpg", mainIngredients:["番茄 2个", "鱼片 适量", "番茄沙司 一勺"], seasonings:["葱 一小段", "姜 一小块", "蒜 6瓣", "盐 适量", "油 适量", "水 适量", "料酒 适量", "胡椒粉 适量"], steps:["番茄热水烫去皮，切成小块。", "鱼片加料酒和胡椒粉腌制十分钟。", "葱，姜，蒜切好备用。", "热锅放油，把葱姜蒜爆香。", "将鱼片放锅里稍微翻炒一下，盛出备用。", "热锅加油，放入番茄翻炒出沙，加入番茄沙司。", "加水煮开，放盐调味。", "水开后加入鱼片。", "煮至鱼片飘起就可以吃啦。"] },
  { id:9, name:"酸辣土豆丝", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"先将土豆去皮洗净，修整一下（方便站稳），切丝，将切好的土豆丝泡凉水里，防止土豆变黑。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201512/0218/021856475191.jpg", mainIngredients:["土豆 300克", "青椒 1/2个", "红椒 1/2个"], seasonings:["剁椒 10克", "姜 10克", "蒜 10克", "葱 10克", "盐 5克", "鸡粉 3克", "白醋 15克", "香油 5克", "味精 3克"], steps:["先将土豆去皮洗净，修整一下（方便站稳），切丝，将切好的土豆丝泡凉水里，防止土豆变黑。", "青红椒洗净去蒂去筋膜，切丝备用。", "锅内加清水,水烧开放2克盐，放入切好的土豆丝，焯水捞出备用。", "葱姜蒜洗净，蒜切沫，葱姜切片。剁椒切成沫备用。", "锅内下20克色拉油，大火将油烧至7成热，下葱姜蒜各10克，泡椒沫10克，煸炒出香味;将青红椒丝放入，炒半分钟。", "然后下焯好的土豆丝，大火爆炒；再放盐3克，味精3克，白醋15克，鸡粉3克，继续大火翻炒1~2分钟。", "出锅前淋5克香油，翻炒均匀即可关火。"] },
  { id:10, name:"清炒茭白", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备好材料，", image:"https://s4.cdn.jiaonizuocai.com/caipu/201605/1915/191526544974.jpg", mainIngredients:["茭白 300克", "青椒 1个", "红椒 1个", "蒜头 3粒"], seasonings:["油 少许", "盐 少许", "鸡精 少许"], steps:["准备好材料，", "把茭白去外皮，切成薄片。把青红椒切成丝，蒜头剁成蒜蓉。", "锅中放入适量水烧开，把茭白放进去焯两分钟", "把茭白捞起沥干水", "热锅冷油，把油烧成七成热，放入蒜蓉煸香！", "再放入茭白翻炒一下", "再放入青红椒翻炒一分钟", "最后根据个人口味加入少许盐，少许鸡精翻炒均匀", "盛入盘中即可食用！"] },
  { id:11, name:"酸菜鱼", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"做酸菜鱼片好鱼片很重要，多说两句。鱼收拾干净后，在鱼的头、尾部各划一刀。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201601/0820/082018241557.jpg", mainIngredients:["鲈鱼（1斤半左右） 1条", "酸菜 400克", "红干椒 12个", "泡椒 6个", "红袍花椒 40粒", "泡姜 2片", "鲜汤 适量", "鸡蛋（用蛋清） 1个"], seasonings:["色拉油 100克", "盐 适量", "白胡椒粉 1克", "料酒 10克", "白糖 3克", "蒜 3瓣"], steps:["做酸菜鱼片好鱼片很重要，多说两句。鱼收拾干净后，在鱼的头、尾部各划一刀。", "然后从鱼背顺鱼骨下刀。", "刀紧贴鱼骨慢慢片开。", "片下整片鱼身。另一边如法炮制。", "刀与菜板呈30度角，把鱼身片成薄些的鱼片。", "在鱼片中加入5克料酒、白胡椒粉、蛋清和适量的盐。", "轻轻把鱼片抓匀，腌制10分钟。", "酸菜洗净切成寸段。", "准备好佐料和调料，红干椒一半切成节，蒜切片。如果没有泡姜切两片生姜也可以。", "起锅下40克油，小火炒香一半花椒和红干椒节。", "放入泡姜、蒜片爆香。", "放入酸菜、泡椒炒香。", "加入适量鲜汤、和剩余料酒，放鱼头鱼骨大火烧开后煮15分钟。", "加入白糖和适量的盐调味。", "把酸菜和鱼头鱼骨捞入大碗中。", "转小火，逐片放入鱼片煮熟。", "把鱼片盛入碗中。", "另起锅烧热余下的油，炒香剩余的干红椒和花椒。", "浇在鱼片上面，点缀香菜。", "尝尝？"] },
  { id:12, name:"粉蒸排骨", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"将葱，姜，蒜切片。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201508/3111/311103421713.jpg", mainIngredients:["肋排 700克", "蒸肉米粉 1袋", "蒜粒 3颗", "小葱 2颗", "腐乳汁 10克"], seasonings:["姜 1块", "老抽 2克", "蚝油 10克", "糖 5克", "盐 5克", "料酒 10克"], steps:["将葱，姜，蒜切片。", "将排骨冲洗干净无血水后，捞出沥干水分。", "将排骨内加10克料酒，两三片姜和蒜，加入腐乳汁10克，老抽2克，蚝油10克，糖5克，盐5克，搅拌均匀后，腌制15-30分钟。腌制时间越来排骨越入味。", "将米碎倒入腌好的排骨中，抓匀。使每块排骨表面都均匀包裹着米碎。", "将排骨放入盘中，蒸锅内加清水，将排骨放入蒸锅内，用中火蒸30分钟。", "将排骨端出，撒上葱，一道美味可口，色香味俱全的粉蒸排骨就展现在大家面前了。"] },
  { id:13, name:"番茄菜花", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"白菜花洗净，掰成小块。西红柿洗净，切成滚刀块。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201509/1310/131001018532.jpg", mainIngredients:["白菜花 500克", "西红柿 100克"], seasonings:["番茄酱 20克", "葱 10克", "姜 10克", "蒜 10克", "盐 10克", "老抽 5克", "味精 10克", "白糖 15克", "料酒 10克", "淀粉 10克", "鸡粉 10克"], steps:["白菜花洗净，掰成小块。西红柿洗净，切成滚刀块。", "葱切沫，姜切沫，蒜切沫", "将淀粉10克，加少许清水调匀备用。", "锅中加清水，大火烧开，将掰好的菜花焯熟，控水备用。", "锅内下15克色拉油，大火烧至7成热，下葱姜蒜沫各10克，西红柿100克。", "爆香后，下番茄酱20克，料酒10克，翻炒。", "然后下焯好的菜花，加盐10克，味精10克，白糖15克，老抽5克，鸡粉5克，大火翻炒。", "加清水10克，用水淀粉勾芡，大火翻炒片刻，出锅装盘。"] },
  { id:14, name:"辣鲫鱼汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"生姜蒜切好备用", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0500/050022309968.jpg", mainIngredients:["小鲫鱼 五条", "青椒 半个", "生姜 一块"], seasonings:["小米辣 三个", "蒜 三个", "盐 适量", "十三香 适量", "鸡精 适量", "生抽 半勺"], steps:["生姜蒜切好备用", "切碎", "锅中倒入油", "油热八成，放鱼！煎至两面金黄，放生姜蒜末小辣椒", "放盐，生抽，鸡精，十三香，翻炒一分钟！加冷水！", "水开至白色！大火烧三至五分钟！", "最后洒上葱花就可以出锅了！我比较喜欢边炖边吃，放点素菜白菜蘑菇都可以！"] },
  { id:15, name:"正宗俄式罗宋汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"牛肉洗干净切成块", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0515/051559191571.jpg", mainIngredients:["西红柿 1个", "土豆 1个", "洋葱 1个", "卷心菜 1/4", "牛肉 400克", "胡萝卜 1个", "黄油 30克", "黑胡椒 适量", "迷迭香 适量", "百里香 适量"], seasonings:["番茄酱 两大勺", "橄榄油 适量", "盐 适量"], steps:["牛肉洗干净切成块", "牛肉飞下水，然后先在锅里开煮，（根据牛肉大小）提前煮30分钟保证牛肉回个蔬菜一起熟烂", "同时胡萝卜切滚刀块", "包菜用手撕成快，用手撕的才比较好吃", "西红柿顶端用刀画十字", "用热水浇一下", "圆葱切碎", "中式去皮后这个样子", "还有土豆切块，最后是这样的", "牛肉继续煮", "准备橄榄油和黄油，橄榄油和黄油会让汤更浓郁", "下10克黄油和适当橄榄油炒熟", "同样的在下橄榄油和黄油把土豆和胡萝卜炒熟", "同样下橄榄油和黄油炒香大头菜", "同样下橄榄油和黄油然后下西红柿炒出汁水", "下去番茄酱翻炒均匀，我用的是生番茄，如果番茄沙司番茄和沙司不用抄", "再提前煮了30分钟的牛肉汤锅里放入蔬菜", "放入蔬菜后在煮30分钟左右在倒入炒好的番茄酱和番茄块", "在煮约15分钟左右加入适量的淡奶油", "搅拌均了", "出货前加入适量盐和黑胡椒调味", "完美配上黑面包，完美"] },
  { id:16, name:"惊蛰蛋", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备好切成小块", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0611/061112321641.jpg", mainIngredients:["鸡蛋 1", "红枣 3个", "核桃仁 1个", "葡萄干 10粒", "砖茶 一碗"], seasonings:["糖 10克"], steps:["准备好切成小块", "煮砖茶", "干果倒入油锅翻炒", "淋入打好的鸡蛋液快速翻炒", "倒入茶水加入糖（红糖、冰糖、砂糖）", "煮1分钟左右出锅"] },
  { id:17, name:"土豆红烧肉", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"五花肉洗净、切大块，放进锅内焯水，然后洗净，沥净水分备用", image:"https://s1.cdn.jiaonizuocai.com/caipu/201507/0213/021345256926.jpg", mainIngredients:["五花肉 一块", "土豆 两个", "香葱 少许"], seasonings:["盐 适量", "白糖 适量", "番茄酱 少许", "八角 2朵"], steps:["五花肉洗净、切大块，放进锅内焯水，然后洗净，沥净水分备用", "锅烧热，转小火放入油、白糖，然后放五花肉进去煎，将肉的油全部煎出后，放水没过肉，加入盐、八角炖煮", "土豆洗净、去皮、切大块备用", "红烧肉炖煮20分钟后，将土豆放入锅内", "土豆继续炖煮10分钟后，放大火收汤汁", "汤汁收尽前，放入一小勺番茄酱，稍微翻炒出锅"] },
  { id:18, name:"地三鲜", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备食材。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201604/1614/16142927389.jpg", mainIngredients:["土豆 1个", "茄子 1个", "青椒 1个", "白糖 小半勺", "清水 适量"], seasonings:["蒜 2粒", "葱 1小段", "色拉油 适量", "生抽 2勺", "醋 1勺", "淀粉 适量", "鸡精 适量", "盐 适量"], steps:["准备食材。", "土豆切成滚刀块，茄子也切成滚刀快，青椒切成小三角，葱蒜垛成碎未。", "碗中加入生抽，醋，白糖，鸡精，淀粉和适量清水调成调味汁备用。", "锅中放油，烧至6成热。", "放入土豆，炸至金黄，捞出控油备用。", "放入茄子，炸至金黄色，捞出控油备用。", "放入青椒，炸至出现虎皮状，捞出备用。", "锅中留底油烧热，放入切好的葱煸香，葱再留一点出锅用。", "倒入炸好的土豆，茄子，青椒，大火翻炒，同时再加入少许盐翻炒。", "接着倒入调好的料汁，翻炒均匀。", "洒入蒜未和剩余葱未，翻炒片刻关火。", "盛进盘中，一道美味的地三鲜就做好了。"] },
  { id:19, name:"香煎三文鱼", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"洗干净晾干", image:"https://s4.cdn.jiaonizuocai.com/caipu/201506/2919/291942362755.jpg", mainIngredients:["黑胡椒 少许", "柠檬 一个", "新鲜三文鱼 一块"], seasonings:["盐 少许", "橄榄油 适量"], steps:["洗干净晾干", "撒上盐和油", "锅里倒入橄榄油", "油不要太热，放入三文鱼煎5分钟", "反面也煎至5分钟", "最后放在盘子里加入柠檬汁或者片.. 随意..."] },
  { id:20, name:"三杯鸡", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"所有食材、调味准备好。葱姜蒜辣椒切好剥好备用。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201508/2009/061630357664.jpg", mainIngredients:["鸡腿 5只", "葱 数根", "姜 十几片", "米酒 八汤匙", "黑麻油 适量", "罗勒（九层塔） 一把", "红辣椒 二根"], seasonings:["蒜 一整个", "生抽 三汤匙", "老抽 一汤匙", "冰糖 二汤匙", "油 适量"], steps:["所有食材、调味准备好。葱姜蒜辣椒切好剥好备用。", "鸡腿清洗切成块，放在冷水锅中煮沸。", "捞出锅中血沫。焯完拿出鸡块沥水备用。", "把8勺米酒和3勺生抽1勺老抽，再加上2勺冰糖混合调成汁，酒酱油冰糖比例按4：2：1。勺子就是平时喝汤的勺，如图。", "锅热加少许油，再加少许黑麻油。先下姜片煸香，姜片耐煎，煎焦黄了也没事。", "锅中下蒜瓣继续煸香。", "锅中再加葱段和红辣椒丁煸炒出香味。", "锅中倒入备好的鸡块大火翻炒，逼出鸡皮上的油脂，炒至颜色焦黄色。", "倒入调好的调味汁，翻匀，大火烧开转小火焖煮。", "焖煮中途翻一下鸡块。等到汤汁快收干，放入罗勒叶，加盖再焖一会儿。", "起锅前浇上些许黑麻油。", "装盘开吃！"] },
  { id:21, name:"番茄豆腐", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"番茄一个洗干净备用", image:"https://s1.cdn.jiaonizuocai.com/caipu/201603/0919/091918374248.jpg", mainIngredients:["番茄 一个", "豆腐 一块", "蒜瓣 适量"], seasonings:["葱 一根", "盐 适量", "鸡精 适量", "糖 适量"], steps:["番茄一个洗干净备用", "豆腐一块备用", "葱和蒜备用", "将豆腐切小块备用", "锅中放入烧开后放入番茄烫番茄", "将烫好的番茄去皮", "切成豆腐大小的方块", "锅中放入油倒入葱蒜末爆香", "倒入番茄翻炒", "加入适量水烧开", "烧开后加入豆腐煮上一会", "加入适量的盐调味", "一小勺糖提鲜", "起锅前加入鸡精调味", "盛去碗中就可以享用了"] },
  { id:22, name:"可乐鸡翅膀", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"准备好所有材料：可乐，鸡翅膀，生姜片，大葱段。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201605/1621/162136528109.jpg", mainIngredients:["鸡翅膀 10个", "可乐 1瓶", "大葱 3小段", "生姜片 3片"], seasonings:["生抽 适量"], steps:["准备好所有材料：可乐，鸡翅膀，生姜片，大葱段。", "鸡翅膀凉水下锅，大火烧开煮至5分钟关火捞起沥干水份待用。", "洗干净平底锅烧热下适量的花生油把鸡翅膀放下去煎至两面金黄。", "下入生姜片和大葱段小火再煎一会，使其融入姜葱的香味。", "倒入可乐和生抽开大火煮到收汁。（中间需要用长筷子翻另一面，两三次左右这样）", "最后挑出姜葱装盘开吃咯。"] },
  { id:23, name:"木瓜银耳羹", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"银耳洗净泡发撕成小块。", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0623/062326358157.jpg", mainIngredients:["木瓜 1个", "银耳 适量", "红枣 2个", "枸杞 少量", "黄冰糖 适量"], seasonings:[], steps:["银耳洗净泡发撕成小块。", "木瓜削皮去籽切成小块。", "放进炖盅。（吹爆我家的炖盅吖，用了三年多，地位依然如此坚挺不可替代，鲜能炖汤甜可炖糖水。）", "加入银耳。", "红枣洗净去核，枸杞洗好备用。（我家红枣炖汤煮甜品一般都去核，这样既没有那么上火，也能防止孩子被红枣核噎到。）", "炖盅中加入红枣，枸杞，黄冰糖。", "加清水放入炖锅炖三个小时，简单粗暴省事。（如果用锅煮的话，可以先放银耳，红枣加适量清水，大火烧开转小火煲40分钟，加入木瓜，枸杞和黄冰糖，再煲20分钟分钟，关火焖5分钟即可。）", "炖好装碗开吃。", "成品图。真的好喝。"] },
  { id:24, name:"芒果西米露", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备材料：西米50克，芒果1个，牛奶一盒，惠尔康优冻一盒", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0412/041220101730.jpg", mainIngredients:["西米 50克", "芒果 1个", "惠尔康优冻 1盒", "牛奶 250ml"], seasonings:["糖 30克"], steps:["准备材料：西米50克，芒果1个，牛奶一盒，惠尔康优冻一盒", "西米煮12分钟成透明状，捞起冷开水浸泡沥干，芒果切丁，优冻切丁。", "加入30克白糖，根据个人口味加多或少加。", "温奶锅中加热牛奶，直接倒入备好的食材中，搅拌均匀。", "一碗美味的芒果西米露搞定，非常简单！"] },
  { id:25, name:"丝瓜炒蛋", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备好食材", image:"https://s1.cdn.jiaonizuocai.com/caipu/201603/1508/15193453663.jpg", mainIngredients:["丝瓜 1条", "鸡蛋 2-3个"], seasonings:["花生油 适量", "盐 适量"], steps:["准备好食材", "将鸡蛋打散，加入5ml左右的清水，充分搅拌均匀", "将丝瓜去皮切好，转着圈切，不要切太厚", "将锅洗净烧热，倒入足量的油，煎蛋油要多一点", "待油温烧热后，将鸡蛋液倒入锅中爆炒，炒好后装出备用", "将锅中倒入适量的油", "将丝瓜倒入锅中翻炒", "加入适量的水（10-15ml左右）", "丝瓜炒柔软后，将鸡蛋倒入锅中", "加入适量的盐", "翻炒均匀，入味即可，撒些葱花", "装盘"] },
  { id:26, name:"红豆薏米水", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备食材（可根据自己喜欢的添加）浸泡片刻。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201605/1309/130946361189.jpg", mainIngredients:["薏米 50g", "红豆 50g", "绿豆 80g", "糯米 100g"], seasonings:["糖 适量"], steps:["准备食材（可根据自己喜欢的添加）浸泡片刻。", "混合一起冲洗干净。", "将所有材料倒入压力煲里：", "加入适量的水。", "插上电源，调到“八宝粥”功能，压力调到“7”，按下开始键开始煮。", "程序结束后，可以自动泄压，也可以手动泄压，红豆薏米汤做好了，汤清清爽爽，软烂好吃。"] },
  { id:27, name:"牛奶桃胶银耳羹", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"提前一晚泡好桃胶，大概需要12小时，中途看见水有杂质时及时换水，桃胶泡好至少会涨发一倍，每...", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0520/052013129973.jpg", mainIngredients:["银耳 适量", "桃胶 适量", "牛奶 适量", "枸杞 适量", "玫瑰花瓣 适量"], seasonings:["冰糖 适量"], steps:["提前一晚泡好桃胶，大概需要12小时，中途看见水有杂质时及时换水，桃胶泡好至少会涨发一倍，每次不用太多，清理好杂质洗净后没有硬块，银耳提前2小时泡好，撕碎片，备用。", "锅里水烧开，倒入银耳跟桃胶，大火滚煮20分钟，然后调小火慢慢熬煮1个小时的样子。", "待锅中汤汁变得稍微浓稠，就放入适量的冰糖，少量的枸杞，小火在煮半小时。", "在锅中倒入适量的牛奶，待水开时关火。", "玫瑰花瓣撕碎片撒在表面即可。", "完成啦。"] },
  { id:28, name:"虎皮青椒", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"将尖椒洗净，切掉蒂部，可以用小勺挖掉籽。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201603/3010/301011446694.jpg", mainIngredients:["青椒 6根"], seasonings:["油 二汤匙", "生抽 一汤匙", "盐 2克", "糖 一汤匙", "醋 二汤匙", "蒜 二瓣"], steps:["将尖椒洗净，切掉蒂部，可以用小勺挖掉籽。", "如果尖椒较长，可以对半切开。如果比较小，可以在表面轻轻划一些小口，这样比较入味。", "大蒜切成蒜末。将生抽、香醋、糖和盐在碗中调成味汁。", "平底锅中放入油，中小火加至四五成热。将擦干水份的青椒放在锅中。需要不时翻面并用锅铲轻按青椒，使尖椒每面都能受热均匀煎成虎皮，盛出待用。", "热锅凉油，放入蒜末煸香。", "倒入调好的汁，翻炒加热至沸腾。", "把煎好的青椒倒入锅中，翻匀入味。待汤汁浓稠时可出锅。喜欢酱汁更浓稠可勾些许水淀粉。", "装盘享用吧！"] },
  { id:29, name:"鹌鹑蛋红烧肉", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"冷水放入鹌鹑蛋，加1勺盐煮十分钟后，捞出冲凉水，剥壳备用。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201511/0815/081515011844.jpg", mainIngredients:["五花肉 500克", "鹌鹑蛋 25颗左右"], seasonings:["葱 适量", "姜 适量", "生抽 适量", "红烧酱油 适量", "料酒 适量", "糖 适量", "盐 适量", "鸡精 适量", "八角 三个", "桂皮 适量"], steps:["冷水放入鹌鹑蛋，加1勺盐煮十分钟后，捞出冲凉水，剥壳备用。", "五花肉切成均匀的块备用。", "剥好的鹌鹑蛋。", "葱，姜，八角，桂皮。洗净备用。", "锅里倒入少许油，放入五花肉中小火煸炒，加入八角桂皮姜葱一起炒。", "五花肉中小火炒至微黄，加入适量生抽，红烧酱油，料酒，白糖，盐，炒至所有肉上色。（上色时一直用中小火）", "肉炒至上糖色后，倒入适量清水开始大火烧煮。（水刚刚淹没过肉高出一点就可以了）", "汤煮沸后倒入鹌鹑蛋一起焖煮，改中火炖", "炖至剩下少许汤汁时、加入鸡精大火收汁即可。", "成品图"] },
  { id:30, name:"花椰菜洋葱浓汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"准备好所有需要用到的食材", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0311/031138437559.jpg", mainIngredients:["花菜 150克", "洋葱 50克", "黄油 15克", "牛奶 50克", "淡奶油 30克", "黑胡椒 适量", "装饰香草 适量"], seasonings:["水 200克", "盐 适量"], steps:["准备好所有需要用到的食材", "花菜充分清洗干净，并去除下面粗硬的梗、撕开成一英寸左右大小的小朵状，大蒜切片、洋葱切1厘米的丁备用", "锅中放足量的水烧开，放入处理好的花菜煮熟后捞出沥干水分备用", "另起一锅，放入黄油，中火加热，油热后放入洋葱大蒜爆香，然后捞出略微冷却备用", "将所有食材按照牛奶、淡奶油、水或鸡高汤、炒好的大蒜洋葱混合物、花菜的顺序依次放入搅拌杯中，并盖好杯盖", "开启机器开关，将转速从1逐渐加到10档，搅拌1分钟左右到细腻顺滑的浓汤状态即可"] },
  { id:31, name:"宝宝做噩梦清热汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"瘦肉洗干净切小块，沸水下锅烫血水，过冷河洗清浮末。灯芯草、麦冬、淡竹叶洗净沥水。", image:"https://s4.cdn.jiaonizuocai.com/caipu/202003/0220/022032525296.jpg", mainIngredients:["瘦肉 250克", "灯芯草 20枚", "麦冬 15粒", "淡竹叶 适量"], seasonings:[], steps:["瘦肉洗干净切小块，沸水下锅烫血水，过冷河洗清浮末。灯芯草、麦冬、淡竹叶洗净沥水。", "将全部材料冷水放入砂锅中，大火煮沸后转小火焖煮30分钟。", "焖煮时间不宜过长，时间到关火稍凉一点即可饮用，此汤方不需要加盐，淡淡的清香很好入口。"] },
  { id:32, name:"红烧茄子", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"茄子去皮，洗净切滚刀块", image:"https://s4.cdn.jiaonizuocai.com/caipu/201603/0915/091546436861.jpg", mainIngredients:["茄子 2根", "青椒 1个", "西红柿 1个"], seasonings:["蒜 10克", "葱 10克", "盐 5克", "料酒 15克", "白糖 15克", "味精 3克", "鸡粉 3克", "胡椒粉 5克", "番茄酱 10克", "蚝油 5克", "生抽 10克", "醋 10克"], steps:["茄子去皮，洗净切滚刀块", "青椒去蒂去筋膜去辣椒籽后切块，西红柿洗净切块", "蒜葱切沫，取小碗，放15克淀粉，加生抽10克，醋10克，加适量水调成碗欠备用", "锅内下30克色拉油，大火将油烧至7成热，放入茄子煎至微黄后取出备用", "用余油大火加热至7成热，放入肉沫100克，大火翻炒，炒至肉沫变色，放入番茄酱10克，盐5克，味精3克，鸡粉3克，白糖15克，胡椒粉5克，蚝油5克，加入调好的水淀粉，开始熬汁", "待汤汁大火炒出香味，放入炸好的茄子，下青椒丝，西红柿块大火翻炒，青椒炒至断生即可"] },
  { id:33, name:"葱油爽脆南瓜", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"食材有南瓜一块", image:"https://s1.cdn.jiaonizuocai.com/caipu/201605/1722/172215223718.jpg", mainIngredients:["南瓜 适量"], seasonings:["葱 适量", "盐 适量", "味极鲜 适量"], steps:["食材有南瓜一块", "南瓜去皮馕切片洗净备用", "葱切段备用", "锅中放入适量油倒入葱爆香", "倒入南瓜翻炒片刻", "加入适量味极鲜翻炒", "加入少量盐调味", "出锅前加入鸡精和葱调味", "炒好后装入盘中就可以开动啦"] },
  { id:34, name:"酸辣草鱼汤", category:"汤", cookingTime:"40分钟", difficulty:"简单", description:"白菜改刀切成条状，备用（看个人喜好，也可以直接用手撕）", image:"https://s1.cdn.jiaonizuocai.com/caipu/202003/0618/061802192605.jpg", mainIngredients:["草鱼 一条", "酸笋 半块", "大豆腐泡 4个块", "大白菜 4片", "姜末 适量", "小米椒（其他辣椒也可以代替） 适量", "葱花 适量"], seasonings:["花生油 适量", "盐 适量", "水 适量", "料酒 适量"], steps:["白菜改刀切成条状，备用（看个人喜好，也可以直接用手撕）", "酸笋切条，豆腐切块（今天没有豆腐，用豆腐泡代替哈哈哈）", "葱花切末，备用。", "小米椒切末，备用", "草鱼斩成块状，加姜末，料酒腌制一刻钟。", "起锅烧热，炒干酸笋。", "待酸笋微焦，倒入花生油爆炒，捞起备用。", "起锅热油，放入草鱼块翻炒3分钟，倒入开水没过鱼肉，煮5分钟。", "待汤色浓浊，放入酸笋，豆腐泡，辣椒末", "再放入白菜烧煮片刻，不要煮太烂", "起锅前只需要加入盐调味即可。撒上葱花，出锅。"] },
  { id:35, name:"鱼香茄盒", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"洗干净图一的食材", image:"https://s4.cdn.jiaonizuocai.com/caipu/201505/3010/301054027968.jpg", mainIngredients:["鸡蛋 一个", "茄子 1条", "五花肉 250克", "面粉 适量"], seasonings:["葱 适量", "糖 适量", "盐 适量", "蚝油 适量", "胡椒粉 适量", "淀粉 适量", "陈醋 适量"], steps:["洗干净图一的食材", "五花肉剁成肉糜，加入盐糖蚝油胡椒粉葱花，半个鸡蛋顺时针搅拌均匀", "茄子切成图片的大小，中间切一刀，不要切断", "把搅拌的肉糜酿入茄盒，", "鸡蛋加入一勺面粉，一勺淀粉搅拌成糊状…", "如图把茄盒放在面糊沾一下面糊准备炸…", "锅里放适量油，烧制7成热，把沾好的面糊入锅中小火炸…", "炸好的茄盒看出控油备用…", "把两勺陈醋，一勺糖，一勺淀粉加3勺水拌匀调成鱼香汁…", "炸好的茄盒的油倒出，锅里不需留油，开中火，把茄盒快速摆好在锅里，开大火倒入鱼香汁，再转中火焖半分钟，撒上葱花即可出锅了…", "漂亮酸甜的茄盒出锅啦…"] },
  { id:36, name:"酱香蒸鸡腿", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"鸡大腿洗干净沥干", image:"https://s4.cdn.jiaonizuocai.com/caipu/201605/1914/191408407690.jpg", mainIngredients:["鸡全腿 4个", "耗油 1勺"], seasonings:["葱 适量", "姜 适量", "甜面酱 2勺", "酱油 2勺", "料酒 2勺", "生抽 2勺", "白糖 1勺", "番茄酱 1勺"], steps:["鸡大腿洗干净沥干", "用叉子在鸡腿上扎些小孔，尽量均匀一些", "反面也要扎一些小孔", "葱姜切葱片，姜片", "取一个碗把配方用量的甜面酱，番茄酱，酱油，生抽，料酒，耗油，白糖混合均匀", "鸡腿放入保鲜盒中，铺上葱姜片，均匀淋入调好的料汁", "盖上盖子，用力摇晃十分钟，使酱料均匀裹满鸡腿，没有盖子就要用手充分按摩均匀了，然后放入冰箱保鲜层腌制两个小时", "两个小时后取出鸡腿，摆在盘中，把葱姜和酱料也倒在上面", "蒸锅放足量水烧开后，把鸡腿放入锅中，大火烧25—30分钟", "打开锅盖", "把鸡腿单独盛出来，放另一个盘中", "撇去葱姜，把蒸鸡腿的汤汁均匀浇在鸡腿上，我为了拍照方便就取了两只", "撒葱花装饰即可", "鲜嫩的酱香蒸鸡腿做好了"] },
  { id:37, name:"农家小炒肉", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"买回来的肉洗干净，切成片用淀粉酱油、盐将切好的肉腌制10左右。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201508/1111/111125472380.jpg", mainIngredients:["猪肉 250克", "洋葱 1个", "面粉 少许", "青红椒 1个", "黑木耳 2～3朵"], seasonings:["小米辣 2个", "花椒 8～9粒", "花生油 适量", "蚝油 少许", "盐 适量", "醋 适量", "酱油 适量", "淀粉 少许", "姜 少许"], steps:["买回来的肉洗干净，切成片用淀粉酱油、盐将切好的肉腌制10左右。", "将洋葱洗干净对半切开，中间的心不要，接下来将切好的洋葱粘上一层薄薄的面粉备用。", "接下来切配料备用。", "炒锅放油，五层热放肉炒断生，炒肉时里面放一点醋，肉很快就散开了，将炒好的肉盛入碗中备用。", "锅里炒肉剩下的余油炒洋葱，洋葱稍炒一下起锅盛出备用。", "炒锅里置油，油温五层热放花椒炒香，花椒籽捞出，继续放姜，青红辣椒、黑木耳翻炒。", "接着放洋葱，肉一起翻炒，这时火要大一些不停地翻炒，速放盐，蚝油、味精颠两下就可以出锅装盘啦！"] },
  { id:38, name:"荷塘小炒", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"备好图中食材。藕去皮洗净，荷兰豆去筋洗净，百合提前用水泡发，胡萝卜、姜、蒜洗净。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201512/0621/062122027204.jpg", mainIngredients:["荷兰豆 少许", "胡萝卜 半根", "木耳 少许", "百合 少许"], seasonings:["藕 1小节", "油 适量", "盐 少许", "白糖 半茶匙", "鸡精 半茶匙", "姜 1小块", "蒜 2瓣", "生粉 少许"], steps:["备好图中食材。藕去皮洗净，荷兰豆去筋洗净，百合提前用水泡发，胡萝卜、姜、蒜洗净。", "胡萝卜切片，姜切丝，蒜切片。", "藕切片。", "藕片泡入清水中，换2次水。", "取一净碗加少许生粉和水调成湿淀粉备用。", "锅里水烧开，放少许盐。", "倒入藕片、荷兰豆、胡萝卜片、木耳焯水一分钟。", "捞出过冷水后，控干水。", "锅里油烧热，放入姜丝、蒜片爆香。", "倒入藕片、胡萝卜片、木耳、荷兰豆、百合翻炒。", "加入白糖、盐、炒匀。", "加鸡精炒匀。", "倒入湿淀粉后快速翻炒。", "盛出装盘，即食。"] },
  { id:39, name:"番茄炒西兰花", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"西红柿洗净切成小块，西兰花洗净用刀摘成小块。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201511/0413/04134023553.jpg", mainIngredients:["西红柿 100克", "西兰花 150克"], seasonings:["葱 5克", "姜 5克", "蒜 5克", "盐 5克", "鸡粉 5克", "白糖 5克", "料酒 10克", "淀粉 10克"], steps:["西红柿洗净切成小块，西兰花洗净用刀摘成小块。", "葱姜蒜切沫。", "锅中放入清水300克左右，大火烧开，放入摘好的西兰花，焯一下水，倒入漏勺备用。", "锅中下油10克左右，大火烧热，下入葱姜蒜爆香。", "放入西红柿块，炒软炒烂。", "加入西兰花块，放盐、鸡粉、白糖、料酒，大火翻炒均匀，用水淀粉勾欠翻炒，出锅装盘。"] },

// ============ Helpers ============
function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDateCN(dateStr) {
  var parts = dateStr.split('-');
  var y = +parts[0], m = +parts[1], d = +parts[2];
  var w = ['鏃?,'涓€','浜?,'涓?,'鍥?,'浜?,'鍏?][new Date(y, m-1, d).getDay()];
  return y + '骞? + m + '鏈? + d + '鏃?鏄熸湡' + w;
}
function getMonthDays(year, month) {
  return new Date(year, month+1, 0).getDate();
}

// ============ localStorage ============
var STORAGE_KEY = 'daily_recipes_data';
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { history:{}, theme:'default', viewedDate:null };
  } catch(e) { return { history:{}, theme:'default', viewedDate:null }; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// ============ shuffle helpers ============
function seededRandom(seed) {
  var s = 0;
  for (var i=0; i<seed.length; i++) s = ((s<<5)-s+seed.charCodeAt(i))|0;
  return function() { s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
}
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i=a.length-1; i>0; i--) { var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

  if (data.history[dateStr]) return data.history[dateStr];
  var usedIds = new Set();
  Object.values(data.history).forEach(function(ids) { ids.forEach(function(id) { usedIds.add(id); }); });
  var available = RECIPES.filter(function(r) { return !usedIds.has(r.id); });
  var pool;
  if (available.length < 6) {
    var recentIds = new Set();
    var dates = Object.keys(data.history).sort().slice(-7);
    dates.forEach(function(d) { data.history[d].forEach(function(id) { recentIds.add(id); }); });
    pool = RECIPES.filter(function(r) { return !recentIds.has(r.id); });
    if (pool.length < 6) pool = RECIPES.slice();
  } else {
    pool = available;
  }

  var rng = useRandom ? function() { return Math.random(); } : seededRandom(dateStr);

  var meat = shuffle(pool.filter(function(r) { return r.category==='鑽よ彍'; }), rng);
  var veg = shuffle(pool.filter(function(r) { return r.category==='绱犺彍'; }), rng);
  var soup = shuffle(pool.filter(function(r) { return r.category==='姹?; }), rng);
  var selected = meat.slice(0,3).concat(veg.slice(0,2)).concat(soup.slice(0,1));

  if (selected.length < 6) {
    var selIds = new Set(selected.map(function(r) { return r.id; }));
    var remaining = shuffle(pool.filter(function(r) { return !selIds.has(r.id); }), rng);
    while (selected.length < 6 && remaining.length > 0) selected.push(remaining.shift());
  }
  var recipeIds = selected.map(function(r) { return r.id; });
  data.history[dateStr] = recipeIds;
  saveData(data);
  return recipeIds;
}

// ============ Emoji Icons ============
function getRecipeIcon(r) {
  var n = r.name;
  if (n.indexOf('楦?)!==-1 || n.indexOf('缈?)!==-1) return '馃崡';
  if (n.indexOf('楸?)!==-1 || n.indexOf('椴?)!==-1) return '馃悷';
  if (n.indexOf('铏?)!==-1) return '馃';
  if (n.indexOf('鐗?)!==-1) return '馃ォ';
  if (n.indexOf('缇?)!==-1) return '馃崠';
  if (n.indexOf('楦?)!==-1) return '馃';
  if (n.indexOf('鎺掗')!==-1 || n.indexOf('楠?)!==-1) return '馃崠';
  if (n.indexOf('鑲?)!==-1 || n.indexOf('鐚?)!==-1 || n.indexOf('瀹繚')!==-1 || n.indexOf('鍥為攨')!==-1 || n.indexOf('楸奸')!==-1 || n.indexOf('閿呭寘')!==-1 || n.indexOf('浜叡')!==-1 || n.indexOf('姘寸叜')!==-1 || n.indexOf('钂滈')!==-1 || n.indexOf('瀛滅劧')!==-1) return '馃';
  if (n.indexOf('璞嗚厫')!==-1 && r.category==='鑽よ彍') return '馃';
  if (n.indexOf('鍥涘璞?)!==-1) return '馃珱';
  if (n.indexOf('铔?)!==-1) return '馃嵆';
  if (n.indexOf('璞嗚厫')!==-1) return '馃';
  if (n.indexOf('鑼?)!==-1) return '馃崋';
  if (n.indexOf('鍦熻眴')!==-1) return '馃';
  if (n.indexOf('鐜夌背')!==-1) return '馃尳';
  if (n.indexOf('瑗垮叞鑺?)!==-1 || n.indexOf('闈掕彍')!==-1 || n.indexOf('鑿滃績')!==-1 || n.indexOf('鐢熻彍')!==-1 || n.indexOf('鍖呰彍')!==-1 || n.indexOf('鐧借彍')!==-1 || n.indexOf('绌哄績鑿?)!==-1 || n.indexOf('鑿?)!==-1 || n.indexOf('鑺?)!==-1) return '馃ガ';
  if (n.indexOf('榛勭摐')!==-1 || n.indexOf('涓濈摐')!==-1 || n.indexOf('鍐摐')!==-1 || n.indexOf('鍗楃摐')!==-1 || n.indexOf('鑻︾摐')!==-1) return '馃';
  if (n.indexOf('鑿?)!==-1 || n.indexOf('鑿?)!==-1) return '馃崉';
  if (n.indexOf('杈ｆ')!==-1 || n.indexOf('闈掓')!==-1 || n.indexOf('杈?)!==-1) return '馃尪锔?;
  if (n.indexOf('鑺辫彍')!==-1) return '馃ウ';
  if (n.indexOf('钀濆崪')!==-1) return '馃';
  if (n.indexOf('灞辫嵂')!==-1) return '馃';
  if (n.indexOf('姹?)!==-1 && r.category==='姹?) return '馃嵅';
  if (r.category==='鑽よ彍') return '馃崠';
  if (r.category==='绱犺彍') return '馃ガ';
  return '馃嵅';
}

// ============ Render ============
function renderRecipes(recipeIds, targetDateStr) {
  var grid = document.getElementById('recipeGrid');
  var heading = document.getElementById('dateHeading');
  var subtitle = document.getElementById('dailySubtitle');
  var dateBadge = document.getElementById('dateBadge');
  var isToday = targetDateStr === getTodayStr();
  heading.textContent = isToday ? '浠婃棩鎺ㄨ崘 路 5鑿?姹? : formatDateCN(targetDateStr);
  subtitle.textContent = isToday ? '姣忓ぉ鏂伴矞鎼厤锛屽ソ濂藉悆楗? : '鍘嗗彶椋熻氨鍥為【';
  dateBadge.textContent = formatDateCN(targetDateStr);

  var recipes = recipeIds.map(function(id) { return RECIPES.find(function(r) { return r.id===id; }); }).filter(Boolean);
  if (recipes.length===0) {
    grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:var(--text-light);padding:40px;">鏆傛棤椋熻氨鏁版嵁</p>';
    return;
  }
  var catClass = { '鑽よ彍':'cat-meat', '绱犺彍':'cat-veg', '姹?:'cat-soup' };

  grid.innerHTML = recipes.map(function(r, idx) {
    return '<div class="recipe-card ' + (r.category==='姹??'soup-card':'') + '" data-recipe-id="' + r.id + '" data-idx="' + idx + '">'
      + '<div class="card-img-wrap">'
      + (r.image ? '<img class="card-img" src="' + r.image + '" alt="' + r.name + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '')
      + '<span class="card-icon" style="' + (r.image ? 'display:none' : '') + '">' + getRecipeIcon(r) + '</span>'
      + '<span class="card-category ' + (catClass[r.category]||'') + '">' + r.category + '</span>'
      + '</div>'
      + '<div class="card-body">'
      + '<div class="card-name">' + r.name + '</div>'
      + '<div class="card-desc">' + r.description + '</div>'
      + '<div class="card-meta"><span>鈴?' + r.cookingTime + '</span><span>馃搳 ' + r.difficulty + '</span></div>'
      + '</div>'
      + '<div class="card-expand">'
      + '<h4>涓绘枡</h4><ul>' + r.mainIngredients.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
      + '<h4>璋冩枡</h4><ul>' + r.seasonings.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
      + '<h4>鍋氭硶</h4><ol>' + r.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>'
      + '</div>'
      + '<div class="card-toggle" onclick="toggleCard(this)">灞曞紑鏌ョ湅璇︽儏 鈻?/div>'
      + '</div>';
  }).join('');

  grid.querySelectorAll('.recipe-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.card-toggle')) return;
      var toggle = this.querySelector('.card-toggle');
      if (toggle) toggleCard(toggle);
    });
  });
}

function toggleCard(el) {
  var card = el.closest('.recipe-card');
  card.classList.toggle('expanded');
  el.textContent = card.classList.contains('expanded') ? '鏀惰捣璇︽儏 鈻? : '灞曞紑鏌ョ湅璇︽儏 鈻?;
}

function updateButtonVisibility(displayDate) {
  var isToday = displayDate === getTodayStr();
  document.getElementById('todayBtn').style.display = isToday ? 'none' : 'inline-block';
  document.getElementById('refreshBtn').style.display = isToday ? 'inline-block' : 'none';
}

// ============ Theme ============
function applyTheme(theme) {
  if (theme==='default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-dot').forEach(function(d) {
    d.classList.toggle('active', d.dataset.theme===theme);
  });
  var data = loadData(); data.theme = theme; saveData(data);
}

// ============ Calendar ============
var calYear, calMonth, calSelectedDate;
function openCalendar() {
  var today = new Date();
  calYear = today.getFullYear(); calMonth = today.getMonth(); calSelectedDate = getTodayStr();
  document.getElementById('calOverlay').classList.add('active');
  renderCalendar();
}
function closeCalendar() { document.getElementById('calOverlay').classList.remove('active'); }

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = calYear + '骞?' + (calMonth+1) + '鏈?;
  var now = new Date();
  document.getElementById('calNext').disabled = (calYear===now.getFullYear() && calMonth>=now.getMonth());

  var grid = document.getElementById('calGrid');
  var todayStr = getTodayStr();
  var data = loadData();
  var html = ['鏃?,'涓€','浜?,'涓?,'鍥?,'浜?,'鍏?].map(function(h) { return '<div class="cal-day-header">' + h + '</div>'; }).join('');
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = getMonthDays(calYear, calMonth);
  var prevDays = getMonthDays(calYear, calMonth-1);

  for (var i=firstDay-1; i>=0; i--) html += '<div class="cal-day other-month">' + (prevDays-i) + '</div>';
  for (var d=1; d<=daysInMonth; d++) {
    var ds = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var cls = 'cal-day';
    if (ds===todayStr) cls += ' today';
    if (data.history[ds]) cls += ' has-recipe';
    if (ds>todayStr) cls += ' future';
    if (ds===calSelectedDate) cls += ' selected';
    html += '<div class="' + cls + '" data-date="' + ds + '" onclick="onCalDayClick(\'' + ds + '\',this)">' + d + '</div>';
  }
  var remaining = 42 - (firstDay + daysInMonth);
  for (var d2=1; d2<=remaining; d2++) html += '<div class="cal-day other-month">' + d2 + '</div>';
  grid.innerHTML = html;
}

function onCalDayClick(dateStr, el) {
  if (el && (el.classList.contains('future')||el.classList.contains('other-month'))) return;
  calSelectedDate = dateStr;
  document.querySelectorAll('.cal-day').forEach(function(d) { d.classList.remove('selected'); });
  if (el) el.classList.add('selected');
  var data = loadData();
  var recipeIds = data.history[dateStr];
  // auto-generate for past dates without history using date-seeded shuffle
  if ((!recipeIds||recipeIds.length===0) && dateStr < getTodayStr()) {
    recipeIds = selectRecipesForDate(dateStr, data);
    renderCalendar(); // refresh dots
  }
  var div = document.getElementById('calRecipes');
  if (!recipeIds||recipeIds.length===0) {
    div.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:20px 0;">' + (dateStr===getTodayStr()?'浠婂ぉ杩樻病鏈夌敓鎴愰璋憋紝璇峰洖鍒伴椤垫煡鐪?:'璇ユ棩鏈熸殏鏃犻璋辫褰?) + '</p>';
    return;
  }
  var recipes = recipeIds.map(function(id) { return RECIPES.find(function(r) { return r.id===id; }); }).filter(Boolean);
  var badgeMap = {'鑽よ彍':'cat-meat','绱犺彍':'cat-veg','姹?:'cat-soup'};
  div.innerHTML = '<h4>' + formatDateCN(dateStr) + ' 鐨勯璋?/h4>'
    + recipes.map(function(r) { return '<div class="cal-recipe-item" onclick="viewHistoricalRecipe(\'' + dateStr + '\')"><span class="cal-recipe-badge ' + (badgeMap[r.category]||'') + '">' + r.category + '</span><span class="cal-recipe-name">' + r.name + '</span><span style="margin-left:auto;font-size:12px;color:var(--text-light);">' + r.cookingTime + '</span></div>'; }).join('')
    + '<p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-light);">鐐瑰嚮椋熻氨鍙洖鍒伴椤垫煡鐪嬪畬鏁磋鎯?/p>';
}

function viewHistoricalRecipe(dateStr) {
  var data = loadData();
  var recipeIds = data.history[dateStr];
  if (!recipeIds) return;
  data.viewedDate = dateStr; saveData(data);
  closeCalendar();
  renderRecipes(recipeIds, dateStr);
  updateButtonVisibility(dateStr);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============ Refresh & Navigation ============
function refreshToday() {
  var data = loadData();
  var todayStr = getTodayStr();
  delete data.history[todayStr];
  data.viewedDate = null;
  saveData(data);
  // Use random shuffle (not date-seeded) so each click gives different recipes
  var recipeIds = selectRecipesForDate(todayStr, data, true);
  renderRecipes(recipeIds, todayStr);
  document.getElementById('todayBtn').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function goToToday() {
  var data = loadData();
  data.viewedDate = null; saveData(data);
  var todayStr = getTodayStr();
  var recipeIds = selectRecipesForDate(todayStr, data);
  renderRecipes(recipeIds, todayStr);
  document.getElementById('todayBtn').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============ Search ============
var searchTimer = null;
function performSearch(query) {
  if (!query||query.trim().length===0) { closeSearch(); return; }
  var q = query.trim().toLowerCase();
  var results = RECIPES.filter(function(r) {
    if (r.name.toLowerCase().indexOf(q)!==-1) return true;
    if (r.description.toLowerCase().indexOf(q)!==-1) return true;
    var allIngs = r.mainIngredients.concat(r.seasonings).join(' ').toLowerCase();
    if (allIngs.indexOf(q)!==-1) return true;
    if (r.category.indexOf(q)!==-1) return true;
    return false;
  });
  results.sort(function(a, b) {
    var aName = a.name.toLowerCase().indexOf(q)!==-1;
    var bName = b.name.toLowerCase().indexOf(q)!==-1;
    if (aName && !bName) return -1;
    if (!aName && bName) return 1;
    return 0;
  });
  showSearchPanel(results, q);
}

function showSearchPanel(results, query) {
  var overlay = document.getElementById('searchOverlay');
  var panel = document.getElementById('searchPanel');
  overlay.classList.add('active');
  if (results.length===0) {
    panel.innerHTML = '<div class="search-panel-header"><h3>鎼滅储缁撴灉</h3><button class="search-panel-close" onclick="closeSearch()">鉁?/button></div>'
      + '<div class="search-empty">娌℃湁鎵惧埌鍖呭惈 "<b>' + escHtml(query) + '</b>" 鐨勮彍璋?/div>';
    return;
  }
  var catClass = { '鑽よ彍':'cat-meat', '绱犺彍':'cat-veg', '姹?:'cat-soup' };
  panel.innerHTML = '<div class="search-panel-header"><h3>鎵惧埌 ' + results.length + ' 涓彍璋?/h3><button class="search-panel-close" onclick="closeSearch()">鉁?/button></div>'
    + results.map(function(r) {
      return '<div class="search-result-item" data-id="' + r.id + '">'
        + '<span class="sri-icon">' + getRecipeIcon(r) + '</span>'
        + '<div class="sri-info">'
        + '<div class="sri-name">' + highlightMatch(r.name, query) + ' <span class="card-category ' + (catClass[r.category]||'') + '" style="font-size:11px;vertical-align:middle;">' + r.category + '</span></div>'
        + '<div class="sri-desc">' + escHtml(r.description) + '</div>'
        + '<div class="sri-meta"><span>鈴?' + r.cookingTime + '</span><span>馃搳 ' + r.difficulty + '</span></div>'
        + '</div></div>';
    }).join('');
  panel.querySelectorAll('.search-result-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var id = parseInt(this.dataset.id);
      var recipe = RECIPES.find(function(r) { return r.id===id; });
      if (recipe) showRecipeDetail(recipe);
    });
  });
}

function highlightMatch(text, query) {
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx===-1) return escHtml(text);
  return escHtml(text.slice(0,idx)) + '<b style="color:var(--primary);">' + escHtml(text.slice(idx,idx+query.length)) + '</b>' + escHtml(text.slice(idx+query.length));
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showRecipeDetail(recipe) {
  var panel = document.getElementById('searchPanel');
  var catClass = { '鑽よ彍':'cat-meat', '绱犺彍':'cat-veg', '姹?:'cat-soup' };
  panel.innerHTML = '<div class="search-detail">'
    + '<span class="sd-back" onclick="backToSearchResults()">鈫?杩斿洖鎼滅储缁撴灉</span>'
    + '<div class="sd-name">' + getRecipeIcon(recipe) + ' ' + recipe.name + ' <span class="card-category ' + (catClass[recipe.category]||'') + '" style="font-size:12px;vertical-align:middle;">' + recipe.category + '</span></div>'
    + '<div class="sd-desc">' + recipe.description + '</div>'
    + '<div class="sd-meta"><span>鈴?' + recipe.cookingTime + '</span><span>馃搳 ' + recipe.difficulty + '</span></div>'
    + '<h4>涓绘枡</h4><ul>' + recipe.mainIngredients.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
    + '<h4>璋冩枡</h4><ul>' + recipe.seasonings.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
    + '<h4>鍋氭硶</h4><ol>' + recipe.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>'
    + '</div>';
  panel.scrollTop = 0;
}

function backToSearchResults() {
  var input = document.getElementById('searchInput');
  if (input.value.trim()) {
    performSearch(input.value);
  } else {
    closeSearch();
  }
}

function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('active');
  document.getElementById('searchInput').value = '';
}

// ============ Init ============
function init() {
  var data = loadData();
  var todayStr = getTodayStr();
  applyTheme(data.theme);

  // auto-finalize yesterday's recipe (11:59 PM rule)
  var yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  var yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2,'0') + '-' + String(yesterday.getDate()).padStart(2,'0');
  if (!data.history[yStr]) {
    selectRecipesForDate(yStr, data);
  }

  var displayDate = todayStr;
  if (data.viewedDate && data.viewedDate !== todayStr) {
    displayDate = data.viewedDate;
  }

  var recipeIds = selectRecipesForDate(displayDate, data);
  renderRecipes(recipeIds, displayDate);
  updateButtonVisibility(displayDate);

  document.querySelectorAll('.theme-dot').forEach(function(dot) {
    dot.addEventListener('click', function() { applyTheme(this.dataset.theme); });
  });
  document.getElementById('calBtn').addEventListener('click', openCalendar);
  document.getElementById('calClose').addEventListener('click', closeCalendar);
  document.getElementById('calOverlay').addEventListener('click', function(e) { if(e.target===this) closeCalendar(); });
  document.getElementById('calPrev').addEventListener('click', function() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', function() {
    var now = new Date();
    if (calYear===now.getFullYear() && calMonth>=now.getMonth()) return;
    calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar();
  });
  document.getElementById('todayBtn').addEventListener('click', goToToday);
  document.getElementById('refreshBtn').addEventListener('click', refreshToday);
  // search
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() { performSearch(this.value); }.bind(this), 250);
  });
  document.getElementById('searchInput').addEventListener('focus', function() {
    if (this.value.trim()) performSearch(this.value);
  });
  document.getElementById('searchOverlay').addEventListener('click', function(e) {
    if (e.target===this) closeSearch();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key==='Escape') { closeSearch(); closeCalendar(); }
  });
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
