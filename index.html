<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日食谱 - 5菜1汤</title>
<style>
:root {
  --primary: #4CAF50;
  --primary-light: #C8E6C9;
  --primary-dark: #388E3C;
  --bg: #F5F7FA;
  --card-bg: #FFFFFF;
  --text: #333333;
  --text-secondary: #666666;
  --text-light: #999999;
  --border: #E8ECF1;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-hover: 0 8px 25px rgba(0,0,0,0.12);
  --tag-bg: #E8F5E9;
  --tag-text: #2E7D32;
  --badge-meat: #FF6B6B;
  --badge-veg: #4CAF50;
  --badge-soup: #FFA726;
  --modal-overlay: rgba(0,0,0,0.5);
  --accent: #FF7043;
  --radius: 16px;
  --radius-sm: 8px;
  --transition: 0.3s ease;
}
[data-theme="orange"] {
  --primary: #FF7043; --primary-light: #FFE0B2; --primary-dark: #E64A19;
  --tag-bg: #FFF3E0; --tag-text: #E65100; --accent: #FFA726;
}
[data-theme="blue"] {
  --primary: #42A5F5; --primary-light: #BBDEFB; --primary-dark: #1E88E5;
  --tag-bg: #E3F2FD; --tag-text: #1565C0; --accent: #5C6BC0;
}
[data-theme="purple"] {
  --primary: #7E57C2; --primary-light: #D1C4E9; --primary-dark: #512DA8;
  --tag-bg: #EDE7F6; --tag-text: #4527A0; --accent: #E91E63;
}
[data-theme="warm"] {
  --primary: #8D6E63; --primary-light: #D7CCC8; --primary-dark: #5D4037;
  --bg: #FAF8F5; --card-bg: #FFFDF9; --tag-bg: #EFEBE9; --tag-text: #4E342E; --accent: #BF360C;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  transition: background var(--transition), color var(--transition); line-height: 1.6;
}
header {
  background: var(--card-bg); box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  position: sticky; top:0; z-index:100;
  transition: background var(--transition);
}
.header-inner {
  max-width:1200px; margin:0 auto; padding:16px 24px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
}
.logo { font-size:26px; font-weight:700; color:var(--primary); transition:color var(--transition); white-space:nowrap; }
.header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.date-badge {
  background:var(--primary-light); color:var(--primary-dark); padding:6px 14px;
  border-radius:20px; font-size:14px; font-weight:500;
  transition:background var(--transition),color var(--transition); white-space:nowrap;
}
.theme-picker { display:flex; gap:6px; align-items:center; }
.theme-dot {
  width:28px; height:28px; border-radius:50%; border:2px solid transparent;
  cursor:pointer; transition:transform var(--transition),border-color var(--transition);
}
.theme-dot:hover { transform:scale(1.15); }
.theme-dot.active { border-color:var(--text); transform:scale(1.1); }
.theme-dot.green { background:#4CAF50; }
.theme-dot.orange { background:#FF7043; }
.theme-dot.blue { background:#42A5F5; }
.theme-dot.purple { background:#7E57C2; }
.theme-dot.warm { background:#8D6E63; }
.cal-btn {
  background:var(--primary); color:#fff; border:none; padding:8px 18px;
  border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:background var(--transition),transform var(--transition); white-space:nowrap;
}
.cal-btn:hover { background:var(--primary-dark); transform:translateY(-1px); }
.today-btn {
  background:transparent; color:var(--primary); border:1.5px solid var(--primary);
  padding:8px 18px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:all var(--transition); white-space:nowrap; display:none;
}
.today-btn:hover { background:var(--primary-light); }

main { max-width:1200px; margin:0 auto; padding:24px; }
.date-heading { text-align:center; font-size:22px; font-weight:600; color:var(--text); margin-bottom:4px; }
.daily-subtitle { text-align:center; color:var(--text-secondary); font-size:14px; margin-bottom:28px; }
.recipe-grid { }
.recipe-grid::after { content:""; display:table; clear:both; }
.recipe-col { display:inline-block; vertical-align:top; width:calc((100% - 40px) / 3); }
.recipe-col.col1, .recipe-col.col2 { margin-right:20px; }
.recipe-col.col3 { margin-right:0; }
.recipe-col .recipe-card { margin-bottom:20px; }
.recipe-col .recipe-card:last-child { margin-bottom:0; }
@media (max-width:1024px) { .recipe-col { width:calc((100% - 20px) / 2); } .recipe-col.col3 { display:none; } .recipe-col.col2 { margin-right:0; } }
@media (max-width:640px) { .recipe-col { width:100%; margin-right:0; } .recipe-col.col2, .recipe-col.col3 { display:none; } }
.recipe-card {
  background:var(--card-bg); border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); transition:box-shadow var(--transition),transform var(--transition),background var(--transition);
  cursor:pointer; display:flex; flex-direction:column; position:relative;
}
.recipe-card.expanded { overflow:visible; }
.recipe-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-3px); }
.card-img-wrap {
  position:relative; width:100%; padding-top:56%;
  background:var(--primary-light); transition:background var(--transition);
  overflow:hidden;
}
.card-img {
  position:absolute; top:0; left:0; width:100%; height:100%;
  object-fit:cover; transition:transform var(--transition);
}
.recipe-card:hover .card-img { transform:scale(1.08); }
.card-icon {
  position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; align-items:center; justify-content:center;
  font-size:72px; line-height:1;
  transition:transform var(--transition);
}
.recipe-card:hover .card-icon:not([style*="display:none"]) { transform:scale(1.15); }
.card-category {
  position:absolute; top:12px; left:12px; padding:4px 12px;
  border-radius:12px; font-size:12px; font-weight:600; color:#fff; z-index:1;
}
.cat-meat { background:var(--badge-meat); }
.cat-veg { background:var(--badge-veg); }
.cat-soup { background:var(--badge-soup); }
.card-body { padding:16px 18px 0; }
.card-name { font-size:18px; font-weight:600; margin-bottom:4px; color:var(--text); }
.card-desc { font-size:13px; color:var(--text-secondary); margin-bottom:8px; line-height:1.5; }
.card-meta { display:flex; gap:16px; font-size:12px; color:var(--text-light); }
.card-expand { display:none; }
.recipe-card.expanded .card-expand {
  display:block; flex-shrink:0; background:var(--card-bg);
  border-radius:0 0 var(--radius) var(--radius);
  box-shadow:0 10px 25px rgba(0,0,0,0.15); max-height:360px; overflow-y:auto;
  padding:16px 18px; border-top:1px solid var(--border);
}
.card-expand h4 { font-size:13px; color:var(--primary); margin:10px 0 4px; transition:color var(--transition); }
.card-expand h4:first-child { margin-top:0; }
.card-expand ul { list-style:none; padding-left:0; }
.card-expand ul li { font-size:13px; color:var(--text-secondary); padding:2px 0 2px 14px; position:relative; }
.card-expand ul li::before { content:"•"; position:absolute; left:0; color:var(--primary); transition:color var(--transition); }
.card-expand ol { padding-left:18px; }
.card-expand ol li { font-size:13px; color:var(--text-secondary); padding:2px 0; line-height:1.6; }
.card-toggle { text-align:center; color:var(--primary); font-size:13px; cursor:pointer; padding:12px 18px 14px; user-select:none; transition:color var(--transition); }
.card-toggle:hover { opacity:0.7; }
.recipe-card.soup-card { border:2px solid var(--badge-soup); position:relative; }
.recipe-card.soup-card::before {
  content:"今日汤品";
  position:absolute; top:8px; right:12px; z-index:1;
  background:var(--badge-soup); color:#fff; padding:2px 10px;
  border-radius:10px; font-size:11px; font-weight:600;
}
.refresh-btn {
  background:transparent; color:var(--accent); border:1.5px solid var(--accent);
  padding:8px 18px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:500;
  transition:all var(--transition); white-space:nowrap;
}
.refresh-btn:hover { background:var(--accent); color:#fff; transform:translateY(-1px); }
.refresh-btn:active { transform:scale(0.95); }
.modal-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:var(--modal-overlay); z-index:200; justify-content:center; align-items:center; padding:20px;
}
.modal-overlay.active { display:flex; }
.modal {
  background:var(--card-bg); border-radius:var(--radius); max-width:600px; width:100%;
  max-height:85vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); transition:background var(--transition);
}
.modal-header {
  padding:20px 24px; border-bottom:1px solid var(--border); display:flex;
  justify-content:space-between; align-items:center; position:sticky; top:0;
  background:var(--card-bg); z-index:1; transition:background var(--transition),border-color var(--transition);
}
.modal-header h3 { font-size:18px; color:var(--text); }
.modal-close {
  width:32px; height:32px; border:none; background:var(--border); border-radius:50%;
  cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary); transition:background var(--transition);
}
.modal-close:hover { background:#ddd; }
.modal-body { padding:20px 24px; }
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-nav button {
  background:transparent; border:1px solid var(--border); padding:6px 14px;
  border-radius:var(--radius-sm); cursor:pointer; font-size:16px; color:var(--text);
  transition:all var(--transition);
}
.cal-nav button:hover { background:var(--primary-light); }
.cal-nav button:disabled { opacity:0.3; cursor:not-allowed; }
.cal-nav .cal-month-label { font-size:16px; font-weight:600; color:var(--text); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
.cal-day-header { font-size:12px; color:var(--text-light); padding:8px 0; font-weight:600; }
.cal-day {
  aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--radius-sm); cursor:pointer; font-size:14px; transition:all var(--transition);
  position:relative; border:1px solid transparent;
}
.cal-day:hover { background:var(--primary-light); }
.cal-day.today { border-color:var(--primary); font-weight:700; color:var(--primary); }
.cal-day.has-recipe { background:var(--tag-bg); font-weight:600; }
.cal-day.has-recipe::after { content:""; width:5px; height:5px; background:var(--primary); border-radius:50%; position:absolute; bottom:4px; }
.cal-day.other-month { color:#ccc; cursor:default; }
.cal-day.future { color:#ccc; cursor:default; pointer-events:none; }
.cal-day.selected { background:var(--primary); color:#fff; }
.cal-recipes { margin-top:16px; border-top:1px solid var(--border); padding-top:16px; transition:border-color var(--transition); }
.cal-recipes h4 { font-size:15px; margin-bottom:10px; color:var(--text); }
.cal-recipe-item {
  padding:10px 14px; background:var(--bg); border-radius:var(--radius-sm);
  margin-bottom:8px; cursor:pointer; transition:background var(--transition);
  display:flex; align-items:center; gap:10px;
}
.cal-recipe-item:hover { filter:brightness(0.96); }
.cal-recipe-item .cal-recipe-badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
.cal-recipe-item .cal-recipe-name { font-size:14px; color:var(--text); font-weight:500; }
footer { text-align:center; padding:32px 24px; color:var(--text-light); font-size:13px; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
.recipe-card { animation:fadeIn 0.4s ease forwards; }
.recipe-card:nth-child(1) { animation-delay:0.05s; }
.recipe-card:nth-child(2) { animation-delay:0.10s; }
.recipe-card:nth-child(3) { animation-delay:0.15s; }
.recipe-card:nth-child(4) { animation-delay:0.20s; }
.recipe-card:nth-child(5) { animation-delay:0.25s; }
.recipe-card:nth-child(6) { animation-delay:0.30s; }
@media (max-width:640px) {
  .header-inner { padding:12px 16px; }
  .logo { font-size:20px; }
  .header-right { gap:8px; }
  main { padding:16px; }
  .date-heading { font-size:18px; }
  .card-name { font-size:16px; }
}
/* search */
.search-wrap { position:relative; display:flex; align-items:center; }
.search-icon { position:absolute; left:10px; font-size:14px; pointer-events:none; }
.search-input {
  width:150px; padding:7px 12px 7px 30px; border:1.5px solid var(--border);
  border-radius:20px; font-size:13px; outline:none; background:var(--card-bg); color:var(--text);
  transition:all var(--transition);
}
.search-input:focus { width:200px; border-color:var(--primary); }
.search-input::placeholder { color:var(--text-light); }
.search-history { display:none; position:absolute; top:100%; left:0; right:0; margin-top:4px; background:var(--card-bg); border-radius:var(--radius); box-shadow:0 8px 24px rgba(0,0,0,0.15); z-index:200; overflow:hidden; }
.search-history.show { display:block; }
.search-history-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); }
.search-history-header span { font-size:12px; color:var(--text-light); }
.search-history-header button { border:none; background:none; font-size:12px; color:var(--primary); cursor:pointer; }
.search-history-header button:hover { opacity:0.7; }
.search-history-item { display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer; font-size:14px; color:var(--text); border-bottom:1px solid var(--border); transition:background var(--transition); }
.search-history-item:last-child { border-bottom:none; }
.search-history-item:hover { background:var(--primary-light); }
.search-history-item .shi-icon { font-size:12px; color:var(--text-light); flex-shrink:0; }
.search-history-item .shi-time { font-size:11px; color:var(--text-light); margin-left:auto; flex-shrink:0; }
.search-overlay {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:var(--modal-overlay); z-index:150; justify-content:center; align-items:flex-start;
  padding:100px 20px 20px; overflow-y:auto;
}
.search-overlay.active { display:flex; }
.search-panel {
  background:var(--card-bg); border-radius:var(--radius); max-width:700px; width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.2); transition:background var(--transition);
  overflow:hidden;
}
.search-result-item {
  display:flex; align-items:center; gap:12px; padding:14px 20px;
  cursor:pointer; transition:background var(--transition); border-bottom:1px solid var(--border);
}
.search-result-item:last-child { border-bottom:none; }
.search-result-item:hover { background:var(--primary-light); }
.search-result-item .sri-icon { font-size:32px; width:44px; text-align:center; flex-shrink:0; }
.search-result-item .sri-info { flex:1; min-width:0; }
.search-result-item .sri-name { font-size:16px; font-weight:600; color:var(--text); }
.search-result-item .sri-desc { font-size:12px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-result-item .sri-meta { display:flex; gap:10px; font-size:12px; color:var(--text-light); margin-top:4px; }
.search-panel-header {
  padding:16px 20px; border-bottom:1px solid var(--border); display:flex;
  justify-content:space-between; align-items:center;
  transition:border-color var(--transition);
}
.search-panel-header h3 { font-size:16px; color:var(--text); }
.search-panel-close {
  width:28px; height:28px; border:none; background:var(--border); border-radius:50%;
  cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  color:var(--text-secondary);
}
.search-panel-close:hover { background:#ddd; }
.search-empty { text-align:center; padding:40px 20px; color:var(--text-light); font-size:14px; }
.search-detail {
  padding:20px 24px;
}
.search-detail .sd-back {
  display:inline-block; margin-bottom:12px; color:var(--primary); cursor:pointer; font-size:13px;
}
.search-detail .sd-back:hover { opacity:0.7; }
.search-detail .sd-name { font-size:20px; font-weight:600; color:var(--text); margin-bottom:4px; }
.search-detail .sd-desc { font-size:14px; color:var(--text-secondary); margin-bottom:12px; }
.search-detail .sd-meta { display:flex; gap:16px; font-size:13px; color:var(--text-light); margin-bottom:16px; }
.search-detail h4 { font-size:14px; color:var(--primary); margin:12px 0 4px; }
.search-detail h4:first-child { margin-top:0; }
.search-detail ul { list-style:none; padding-left:0; }
.search-detail ul li { font-size:13px; color:var(--text-secondary); padding:2px 0 2px 14px; position:relative; }
.search-detail ul li::before { content:"•"; position:absolute; left:0; color:var(--primary); }
.search-detail ol { padding-left:18px; }
.search-detail ol li { font-size:13px; color:var(--text-secondary); padding:2px 0; line-height:1.6; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">每日食谱</div>
    <div class="header-right">
      <span class="date-badge" id="dateBadge"></span>
      <div class="theme-picker" id="themePicker">
        <span style="font-size:12px;color:var(--text-light);margin-right:2px;">主题</span>
        <div class="theme-dot green active" data-theme="default" title="清新绿"></div>
        <div class="theme-dot orange" data-theme="orange" title="温暖橙"></div>
        <div class="theme-dot blue" data-theme="blue" title="简约蓝"></div>
        <div class="theme-dot purple" data-theme="purple" title="优雅紫"></div>
        <div class="theme-dot warm" data-theme="warm" title="经典棕"></div>
      </div>
      <div class="search-wrap">
        <input class="search-input" id="searchInput" placeholder="搜索菜谱..." autocomplete="off">
        <div class="search-history" id="searchHistory"></div>
        <span class="search-icon">🔍</span>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="刷新今日菜谱">🔄 换一换</button>
      <button class="today-btn" id="todayBtn" title="回到今天">今天</button>
      <button class="cal-btn" id="calBtn">📅 历史食谱</button>
    </div>
  </div>
</header>

<main>
  <h2 class="date-heading" id="dateHeading"></h2>
  <p class="daily-subtitle" id="dailySubtitle"></p>
  <div class="recipe-grid" id="recipeGrid"></div>
</main>

<footer>每日新鲜搭配，好好吃饭</footer>

<div class="modal-overlay" id="calOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>历史食谱</h3>
      <button class="modal-close" id="calClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="cal-nav">
        <button id="calPrev">◀</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button id="calNext">▶</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-recipes" id="calRecipes">
        <p style="color:var(--text-light);text-align:center;padding:20px 0;">点击日期查看当天食谱</p>
      </div>
    </div>
  </div>
</div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-panel" id="searchPanel"></div>
</div>

<script>
// ============ RECIPES DATA ============
var RECIPES = [
  { id:1, name:"鱼香肉丝", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"把瘦肉切丝加入少许盐、料酒和淀粉抓匀腌制十分钟。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201509/1713/011206455053.jpg", mainIngredients:['瘦肉 250克', '青椒 半个', '泡发木耳 一把', '葱 适量', '姜 两片', '蒜 三瓣', '郫县豆瓣酱 一汤勺', '干辣椒或泡椒 五六个'], seasonings:['蚝油 两汤勺', '生抽 一汤勺', '醋 一汤勺', '糖 一汤勺', '淀粉 适量', '盐 少许', '料酒 一勺', '油 适量'], steps:['把瘦肉切丝加入少许盐、料酒和淀粉抓匀腌制十分钟。', '调酱汁:取小碗放入两勺蚝油，一勺醋，一勺生抽，一勺糖，一勺豆瓣酱，剁碎的红干椒或者泡椒混合搅拌均匀。', '木耳、辣椒、胡萝卜和姜切丝，切蒜末和葱花。', '锅中倒适量油烧至五成热，放入葱姜蒜爆香。', '放入肉丝翻炒至变白断生。', '加入提前调好的酱汁。', '再倒入青椒、木耳、胡萝卜丝翻炒均匀，用刚才装酱汁的小碗装点水加进去，大火炒至酱汁浓稠即可。', '成品图。'] },

  { id:6, name:"土豆藕饼", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"土豆洗净，用刀切土豆片", image:"https://s1.cdn.jiaonizuocai.com/caipu/201801/1317/131744413425.jpg", mainIngredients:['土豆 一个', '藕 半个'], seasonings:['盐 一小勺', '油 适量', '鸡精 一小勺'], steps:['土豆洗净，用刀切土豆片', '藕切片备用', '锅添水，放入土豆', '盖上盖，中火蒸十分钟', '蒸熟的土豆片', '用勺子压成泥', '胡萝卜切末备用', '放入胡萝卜', '加入淀粉，一小勺盐，一小勺鸡精，搅拌均匀', '土豆泥中间加藕片', '把土豆藕饼蘸上芝麻', '锅烧热，放入食用油', '放入土豆藕饼', '中小火煎两面金黄即可', '煎好的土豆藕饼'] },
  { id:7, name:"蜂蜜鸡肉块", category:"荤菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['鸡胸肉 150克', '面粉 适量', '鸡蛋 1个', '食用油 适量', '酱汁材料：'], seasonings:['盐 适量', '胡椒粉 适量', '料酒 1汤匙', '盐 适量', '水 少许', '番茄酱 50克', '糖 30克', '蜂蜜 1汤匙', '水 30克'], steps:[] },
  { id:8, name:"鱼嘴肉包子", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"先揉面:用中号吃饭碗取面粉一碗放盆里", image:"https://s4.cdn.jiaonizuocai.com/caipu/201601/1100/110007346290.jpg", mainIngredients:['包子皮', '面粉 1碗', '安琪酵母 1勺', '包子馅', '肉馅 适量', '韭黄 适量', '姜末 适量'], seasonings:['酱油 适量', '盐 适量', '胡椒粉 适量', '清水 适量'], steps:['先揉面:用中号吃饭碗取面粉一碗放盆里', '平时吃饭的勺取一勺酵母，用三十度左右温水化开（水少点儿，面粉不多）', '左手拿酵母水碗往面粉里倒，右手拿筷子不停搅和面粉，成大片的棉絮状（水不够就加点温水，宁少勿多，因为碗里的水中全是酵母呢）', '揉匀面团（这步讲究三光:盆光，面光，手光），盖上盖，放温暖处发酵', '待面团发酵至原体积两倍大（这步按温度和酵母的多少自行掌握，我这里十五度四个多小时），用手指沾干面粉戳下去无回缩，发酵完成', '等待面粉发酵的时间准备包子馅儿:肉馅内加姜末、酱油、盐、胡椒粉各适量顺一个方向拌匀，适量清水分次打入肉馅内，稍静置后加入洗净切碎的韭黄也顺方向拌匀备用', '发好的面团先取出排气:案板上撒薄薄一层面粉', '手沾干粉将面团取出放案板上', '表面撒薄薄面粉开揉', '以转圈按揉的方式揉面团，边揉边撒适量干面粉', '一小会儿后切开看看，里面气孔较大', '再揉，越揉面团越光，再切开看看，气孔明显变小而均匀', '再次揉匀后气孔基本消失，从中间分开', '掐断成条状', '双手轻握面团上方滚成均匀圆柱形，切剂子，在剂子上也撒薄薄干面粉', '刀切面向上按扁成圆', '用擀面杖擀成中间厚边缘薄的面皮', '包馅了，左手托起面片，右手用勺取适量肉馅放面皮中间，再用右手拇指和食指分放面皮内外侧，均匀捏褶', '收口（一般包法到这里就完成了，要想成鱼嘴就得再捏一圈）', '在包子褶的上端再轻捏一圈成鱼嘴形', '蒸锅里放适量冷水，包好的包子依次间隔码放于事先抹油的蒸屉上，盖锅盖，再次醒发十分钟左右', '开盖看看，感觉包子皮开始发胀，用手轻轻托起一个看看，能感受到发泡发轻，开火蒸，大火烧开锅后蒸十分锅，关火，虚蒸三四分钟，出锅', '取出的包子先将底部向上晾干水气', '再翻面晾晾，这样包子就不会粘破皮了', '摆个盘', '再来一盘'] },
  { id:9, name:"糖醋排骨", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"排骨切小块，冷水下锅，水开后撇去浮沫，加入葱姜蒜，八角，花椒，加少许盐，几滴醋，转小火炖1小时左右", image:"https://s4.cdn.jiaonizuocai.com/caipu/201708/2316/231643119341.jpg", mainIngredients:['排骨 适量', '葱 适量', '蒜 适量', '姜 适量'], seasonings:['花椒 适量', '糖 适量', '料酒 适量', '冰糖 适量', '八角 适量', '盐 适量', '醋 适量', '酱油 适量', '芝麻 适量'], steps:['排骨切小块，冷水下锅，水开后撇去浮沫，加入葱姜蒜，八角，花椒，加少许盐，几滴醋，转小火炖1小时左右', '捞出排骨，沥干水分', '盛出一小碗排骨汤备用', '锅中热油，加适量糖炒出糖色', '放入排骨，炒至上色后加入料酒，酱油，醋', '加入排骨汤，转小火闷20分钟左右，然后开大火收汁', '收汁过程中加入少许冰糖，汁收干后沿锅边再倒入少许醋', '出锅，撒上白芝麻', '配上之前做好的冬瓜排骨汤，一份排骨两道菜'] },
  { id:10, name:"什蔬鱼肉粥 (宝宝辅食）", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"大米清洗干净，浸泡一小时", image:"https://s1.cdn.jiaonizuocai.com/caipu/201901/1700/170010068532.jpg", mainIngredients:['芹菜 30克', '胡萝卜 30克', '熟鱼肉 30克', '大米 30克'], seasonings:[], steps:['大米清洗干净，浸泡一小时', '倒入锅中，加入适量水，煮至软烂', '鱼提前蒸熟，去刺取肉备用', '胡萝卜切碎沫', '芹菜切碎沫', '待粥煮至软烂时倒入胡萝卜和芹菜沫，搅拌均匀煮十分钟', '再倒入鱼肉，搅拌均匀煮一分钟即可', '稍稍冷却一会儿就可以给宝宝吃啦'] },
  { id:11, name:"萝卜炖牛腩", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"准备好豆瓣酱、生抽、料酒、冰糖、八角、桂皮、葱姜蒜、干红辣椒、小茴香、花椒", image:"https://s4.cdn.jiaonizuocai.com/caipu/201601/2609/271521252147.jpg", mainIngredients:['牛腩 500克', '萝卜 二个', '小茴香 一小撮', '干红辣椒 三四根', '姜 数片', '蒜 三四瓣'], seasonings:['豆瓣酱 二汤匙', '生抽 二汤匙', '盐 适量', '冰糖 适量', '料酒 二汤匙', '花椒 一小撮', '八角 一个', '桂皮 一小块', '油 适量'], steps:['准备好豆瓣酱、生抽、料酒、冰糖、八角、桂皮、葱姜蒜、干红辣椒、小茴香、花椒', '牛腩冷水中泡半小时，期间换两次水，清洗干净。放入冷水锅中煮开，撇去血沫。', '将焯水的牛腩切成2cm左右的小方块。', '热锅温油，小火先后下姜、蒜、花椒、干红辣椒爆香。', '将切块牛腩放入锅中，煸干水份。', '煸到牛腩略黄水份煸干，下豆瓣酱翻匀。', '然后调入生抽、料酒、冰糖、小茴香、桂皮、八角，翻匀。', '接着把洗净切块的萝卜放入锅中翻匀。', '锅中倒入一碗热水，不用太多，萝卜会释放一定水分,电高压锅炖煮水分也不怎么会流失。', '将所有食材转放入高压锅内，开启牛腩模式。如果用普通锅或铸铁锅炖煮，可能需要1个多小时，萝卜等牛腩炖至用筷可顺利插入时再加入，否则萝卜长时间炖会炖散了。用电压力锅煮的时间短，一起放入，萝卜一般不会炖散了。', '炖完放入砂锅，尝一下味道，不够咸，加些盐。小火炖煮几分钟，收浓汤汁。', '上桌享用吧！'] },
  { id:12, name:"咸肉片炒白菜", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"将大白菜洗净切成粗丝，把梗和叶分开来放；咸肉切成薄片，把蒜头切片，干辣椒切段，葱和姜切末；", image:"https://s1.cdn.jiaonizuocai.com/caipu/201702/1812/181212284053.jpg", mainIngredients:['白菜 450克', '咸肉 150克', '葱 少许', '姜 少许', '蒜头 3瓣', '干辣椒 5个', '辣椒酱 1汤匙'], seasonings:['白糖 少许', '料酒 少许', '胡椒粉 1/4茶匙', '清水 2汤匙'], steps:['将大白菜洗净切成粗丝，把梗和叶分开来放；咸肉切成薄片，把蒜头切片，干辣椒切段，葱和姜切末；', '锅置炉上，先放入咸肉片，升中火，加清水2汤匙，煸出油，但不要把油完全煸出来；', '稍后把煸出油的咸肉片盛出备用；', '锅中留底油，烧热后倒入姜末和蒜片炝锅；', '放入干辣椒爆香；', '倒入白菜梗，翻炒均匀至变软；', '接着加入白菜叶，翻炒片刻；', '最后倒入咸肉片和白菜一起翻炒；', '加入辣椒酱、白糖调味，在锅边淋入少许料酒，撒胡椒粉约1/4茶匙，翻炒均匀即可出锅；', '装盘后撒上葱末即可上桌。'] },
  { id:13, name:"灯笼茄子", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"将五花肉洗净去皮切末，装入碗中", image:"https://s4.cdn.jiaonizuocai.com/caipu/201801/1121/11214937294.jpg", mainIngredients:['长茄子 1根', '胡萝卜（或者红椒） 20克', '五花肉末 60克', '淀粉水（勾芡用） 2勺', '葱 少许', '姜 适量', '蒜 适量'], seasonings:['盐 1克', '料酒 1勺', '酱油 少许', '生抽 少许', '淀粉 1勺', '胡椒粉 少许', '味精 少许'], steps:['将五花肉洗净去皮切末，装入碗中', '加入 盐、料酒、酱油、淀粉拌匀腌制一会', '将茄子洗净切成5厘米长的段', '再切成1厘米左右的片，茄子皮部留1厘米不切断', '将腌制好的肉末塞入茄子的夹层里，同时锅烧半锅开水', '装入盘中', '放入开水锅中蒸10分钟', '蒸茄子的时候，将葱、姜、蒜洗净切细末', '红萝卜分别切灯笼须和灯笼的口', '放入盐腌制变软', '另起锅烧热油，爆香姜、蒜', '加入少许清水烧开，调入胡椒粉、味精，淋入淀粉水勾芡，淋入生抽', '将蒸好的茄子端出锅', '摆入盘中，再把红萝卜切的灯笼须和灯笼口摆上灯笼的上、下即可', '再撒上葱末，淋入刚调好的料汁即可', '成品图'] },
  { id:14, name:"叫醒春困的娃，只需要这一块小饼", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"面粉中加少量的盐和植物油，用温水和成面团，饧十分钟。 宝餐提示：盐分可以增加面团的力气，油分可以让面团更滋润。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201803/0617/061706272430.jpg", mainIngredients:['面粉 1碗', '鸡蛋 1枚', '洋葱 1块', '胡萝卜 1块', '小葱 2根'], seasonings:['盐 1g', '黑胡椒粉 0.5g', '油 1大勺'], steps:['面粉中加少量的盐和植物油，用温水和成面团，饧十分钟。 宝餐提示：盐分可以增加面团的力气，油分可以让面团更滋润。', '洋葱、胡萝卜、小葱切碎。 宝餐提示：胡萝卜可以焯一下水，加几滴橄榄油拌一拌，帮助营养有效吸收。', '加胡椒、盐和油调匀。加强版的醒春小料就做好了。 宝餐提示：油分可以适当多一些。', '面团做成大小均等的剂子，擀成薄片。', '将醒春馅薄薄的均匀的涂在一张面皮上，从一头小心的卷，尽量卷紧。', '从一头小心的卷起，直至成为一个圆柱形的条，再小心的卷成蜗牛状，收口要在下面。 宝餐提示：料已备齐，造型也是极重要的，千层饼的关键就在这两次卷。', '再次擀成一个个圆饼，在锅中烙熟。', '打散一颗鸡蛋，涂在小饼的一面，立刻盖上另一张饼，煎熟就可以啦。'] },
  { id:15, name:"西红柿炖牛腩", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"牛腩提前清水浸泡一小时，多换水", image:"", mainIngredients:['牛腩 500克', '西红柿 5只', '干红辣椒 3根', '蒜 3瓣', '葱 3根', '姜 2片'], seasonings:['花椒 5克', '桂皮 1片', '八角 2个', '生抽 1汤匙', '老抽 1茶匙', '料酒 2汤匙', '盐 适量', '黑胡椒粉 适量', '油 适量', '冰糖 适量'], steps:['牛腩提前清水浸泡一小时，多换水', '西红柿底部划十字', '西红柿底部划十字', '开水烫几分钟', '去皮', '切成小块', '装碗备好', '姜切片，葱和辣椒切段，蒜去皮，桂皮花椒八角备用', '牛腩切成3cm左右的方形块状', '放入冷水锅中', '点火，加热', '煮二三分钟，撇去浮沫', '捞出牛腩', '放热水中，冲去沾在牛腩上的浮沫', '牛腩沥水装盘备用', '锅坐炉上，点火', '锅热加入油', '下牛腩', '煸去些许水分', '加入葱姜蒜炒香', '加入辣椒、八角、花椒、桂皮', '炒香后加入一半的西红柿块', '西红柿炒软出水', '加料酒', '加入生抽、老抽翻匀', '牛腩放入电压锅，加热水', '水量与牛腩持平', '电压锅牛腩模式三十分钟', '牛腩盛出，去掉八角桂皮', '再起一锅，加油', '剩下一半的西红柿放入锅中翻炒', '炒至变软出沙，放入炖好的牛腩', '加盐', '加黑胡椒粉', '放入冰糖', '小火炖煮十分钟，汤汁收浓即可', '一道美味的西红柿炖牛腩就做好了。', '我是糯米baby，来香哈一起交流吧!'] },
  { id:16, name:"番茄牛腩炖土豆", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"准备好材料", image:"https://s4.cdn.jiaonizuocai.com/caipu/202104/2819/281928204391.jpg", mainIngredients:['牛腩 500克', '番茄 2个', '土豆 1个', '胡萝卜 1个', '葱 10克', '姜 5片', '蒜 2瓣', '干红辣椒 2个', '食用油 适量'], seasonings:['八角 2个', '桂皮 1小块', '香叶 2片', '冰糖 20克', '料酒 1勺', '生抽 1勺', '老抽 半勺', '蚝油 1勺', '盐 适量', '开水 适量'], steps:['准备好材料', '番茄切块，牛腩洗净切小块，葱切寸段，蒜切片，姜切片', '冷水下锅，放入牛腩、3片姜、1勺料酒', '焯烫出血水后捞出冲洗干净控干水分备用', '锅中倒入适量的食用油烧热，放入冰糖，小火炒至融化变成焦黄色', '放入牛腩炒至上糖色', '加入葱姜蒜、八角、桂皮、香叶、干红辣椒炒出香味', '加入生抽', '加入蚝油', '加入老抽', '翻炒至上色', '加入番茄炒匀', '加入开水，没过食材即可', '大火烧开转小火炖煮一小时', '土豆去皮切块，胡萝卜去皮切块', '约1小时后，加入适量的盐调味', '加入胡萝卜和土豆', '炒匀后大火烧开转小火继续炖煮15分钟即可', '成品图', '图二', '图三'] },
  { id:17, name:"酱香鸭腿肉", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"鸭腿洗净，用牙签扎一下鸭皮，再用厨房纸巾吸干水分", image:"https://s4.cdn.jiaonizuocai.com/caipu/201603/3013/301324154534.jpg", mainIngredients:['鸭腿 两只', '葱姜 适量', '黄酱 1勺', '酱豆腐 1块儿', '生抽或黄豆酱油 适量', '黄酒或白酒 1勺'], seasonings:['甜面酱 1勺', '冰糖 5-6颗', '盐 适量', '花椒 1小捏', '八角 1个', '香叶 1-2片', '桂皮 1小段'], steps:['鸭腿洗净，用牙签扎一下鸭皮，再用厨房纸巾吸干水分', '锅中抹上底油小火煎鸭腿，先放有皮的一面', '煎至两面微黄捞出', '黄酱用适量生抽调开，加入甜面酱和酱豆腐调成酱汁（也可倒入适量酱豆腐汁）', '准备好调味料', '另起锅加入足量的水烧开，放入花椒、八角、香叶、桂皮、葱姜，倒入调好的料汁，放入鸭腿，加入适量的黄酒（没有就直接用白酒代替了），冰糖，大火烧开转小火炖1小时', '40分钟后可以加入少许的盐调味，为了鸭腿更好的上色，中途可以给鸭腿翻一下面，一小时后关火泡上1小时，让鸭腿更好的入味', '泡上1小时后开大火收汁上色，大概煮5分钟左右把鸭腿捞出，汤汁继续收成拉黏的状态就好了', '捞出的鸭腿趁热切块儿，摆盘浇上浓浓的酱汁就好了', '盛上一碗米饭，放上鸭腿肉浇上浓浓的酱汁，在配一些喜欢的蔬菜，慢慢享用吧'] },
  { id:18, name:"凉拌手撕鸡胸肉", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"准备食材备用，鸡胸肉，小米椒，大蒜，葱，姜", image:"https://s1.cdn.jiaonizuocai.com/caipu/202107/1609/160942387171.jpg", mainIngredients:['鸡胸肉 2块', '小米椒 4个', '香菜 3颗', '大蒜 一头', '葱 一根', '姜片 适量', '热油 适量'], seasonings:['料酒 2勺', '生抽 2勺', '醋 2勺', '糖 一勺', '盐 适量', '鸡精 适量', '辣椒面 适量'], steps:['准备食材备用，鸡胸肉，小米椒，大蒜，葱，姜', '鸡胸肉冷水下锅，加入葱姜料酒，大火煮开转小火焖煮30分钟，小火焖煮能使鸡胸肉不柴，口感更细腻', '煮好捞出放入冷水中降温', '然后把鸡胸肉撕成丝', '碗中加入，蒜末，小米椒，辣椒面', '用热油泼一下激出香味', '加入2勺生抽', '加入2勺醋', '加入适量的盐', '加入适量的鸡精', '加入一勺糖', '搅拌均匀即可', '香菜洗干净切段', '再香菜和料汁倒入鸡胸肉里，抓拌均匀即可', '一道香辣下饭，低卡减脂的凉拌手撕鸡胸肉就做好了', '成品图！'] },
  { id:19, name:"香浓红烩牛腩", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"准备食材", image:"", mainIngredients:['牛腩 一块', '土豆 一个', '洋葱 一个', '黄冰糖 一块', '葱 少许', '姜 3片'], seasonings:['料酒 3勺', '老抽 2勺', '生抽 3勺'], steps:['准备食材', '牛腩切块', '装盘', '土豆刨皮', '切块', '洋葱切块', '装盘', '牛腩冷水下锅', '焯水后捞出沥干', '热锅冷油', '放入冰糖炒糖色', '放入牛腩翻炒', '放姜和料酒', '放老抽和生抽', '加入清水', '大火烧开', '转小火慢炖', '放土豆慢炖一会', '放洋葱翻炒后大火收汁', '一道美味的香浓红烩牛腩就好了', '我是普木，一起来香哈交流吧'] },
  { id:20, name:"咖喱鸡肉", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"胡萝卜切小块", image:"", mainIngredients:['鸡胸肉 一块', '洋葱 80克', '胡萝卜 1根', '土豆 1个', '咖喱粉 适量'], seasonings:['油 适量', '盐 适量', '生抽 一勺', '水 适量', '料酒 一勺'], steps:['胡萝卜切小块', '装盘备用', '土豆切小块', '装盘备用', '鸡胸肉先切条', '再切小块', '装碗备用', '洋葱切小块', '装碗备用', '油热下洋葱爆香', '下鸡肉炒至断生', '加土豆胡萝卜块', '炒匀加生抽', '炒匀', '加料酒', '炒匀加水', '加咖喱粉', '拌匀', '开锅后转小火继续煮', '汤汁变浓稠加盐', '拌匀即可', '一道美味的咖喱鸡肉就做好了', '我是橘子香味，来香哈一起交流吧！'] },
  { id:21, name:"咖喱土豆牛肉", category:"荤菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['牛肉 400克', '土豆 1个', '洋葱 半个', '咖喱粉 1勺'], seasonings:['油 适量', '盐 适量', '开水 适量'], steps:[] },
  { id:22, name:"酸菜鱼", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"买草鱼，我这是卖家清理好了的。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201605/2017/201746439445.jpg", mainIngredients:['草鱼适量 适量', '酸菜，盐，胡椒，味精 适量', '花椒，干红辣椒，香醋 适量', '料酒，生姜片，大蒜片 适量', '香辣油，葱段，葱花 适量', '食用油，酱油 适量'], seasonings:[], steps:['买草鱼，我这是卖家清理好了的。', '自己冲洗干净', '沥干水装入汤碗，给点料酒，给少量盐，给少量生姜末拌匀盖上保鲜膜腌制一个小时。', '生姜，大蒜切片，干红辣椒切一刀两段，切点葱段，（葱花忘拍了）', '酸菜我是自己做的，自己没有可以买。', '酸菜拿出来，（我这个酸菜不用洗的做之前洗干净了的）切成大点的段备用。', '热锅给油下生姜，大蒜，花椒，干红辣椒，葱段炒香', '把刚炒的调料摆锅一边，放腌制好的鱼大火煎至金黄色。', '加水，加酸菜加少量盐，（酸菜是咸的，刚才腌制鱼也给了盐的只要给水的盐就可以了）煮开。', '盖上盖子焖五分钟左右', '开盖给香醋', '给酱油，胡椒粉拌匀煮三分钟左右', '给味精拌匀', '起锅装在汤碗里先不放汤，加点香辣油再把汤倒入碗里。', '给点葱花', '上桌，配点酒。'] },
  { id:23, name:"香菇猪肉包子", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"成品图", image:"https://s1.cdn.jiaonizuocai.com/caipu/201611/1311/131105041288.jpg", mainIngredients:['面粉 350克', '馅：', '猪肉 300克', '香菇 5个', '香葱 适量'], seasonings:['酵母 3克', '白糖 5克', '蚝油 适量', '生粉 适量', '生抽 适量', '麻油 适量', '色拉油 适量', '胡椒粉 适量', '白糖 适量', '盐 适量'], steps:['成品图', '用一个干净的大盆，放入面粉，放入5克白糖', '用150克35℃左右温水化开酵母，倒入面粉中（面粉吸水量不同，水量仅供参考）', '用筷子搅拌成絮状，无干粉即可', '用手揉成不沾手，光滑的面团（揉面技巧：盆光，面光，手光）', '盖上干净的布放在温暖处发酵（可以放太阳底下，也可以放在装有温水的锅里，35℃左右水不烫手为宜）这样可以加快发酵', '猪肉剁成肉泥备用', '香菇切成末，葱切葱花备用', '用一个干净的碗，依次放入剁好的肉泥，香葱，香菇，加入适量玉米油，蚝油，生抽，生粉，盐，白糖，胡椒粉，麻油，料酒', '用手抓捏均匀备用', '面团发酵至原来的两倍大，用手指在中间戳一个洞，周围面团不回缩', '扒开里面蜂窝组织丰富，就是发酵成功了', '案板上撒些干面粉，把面团揉匀排气，只要不怕累，多揉几分钟，揉的越光滑越有劲道，包子越好吃', '揉成光滑的圆形长条', '用刀切分成大小差不多的剂子', '用擀面杖擀成中间厚，边上薄一些的圆形面饼', '取一张面饼放入适量肉馅', '左手托着面饼，右手食指和大拇指从右边开始，顺着边缘往左捏褶皱', '左手托着面饼，右手食指捏褶皱，大拇指跟着转，边转边捏', '一直捏到最后，褶皱捏的要均匀一些', '收口捏紧，一个包子就完成了', '依次做好后放入锅中，盖上锅盖，醒30分钟再蒸', '大火蒸，上汽开始计时，蒸12分钟，关火后焖3分钟再开锅盖', '白白胖胖的包子就蒸好了（建议放包子时中间距离大一些，以免长大后粘连在一起）', '卖相好的出来做代表', '掰开看看，特别暄软', '成品图再来一张'] },
  { id:24, name:"番茄鸡肉焗饭", category:"荤菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['鸡胸肉 100g', '番茄 1个', '胡萝卜 70g', '土豆 70g', '青椒 1个', '红椒 1个', '洋葱 70g', '马苏里拉芝士 80g', '食用油 适量'], seasonings:['生粉 适量', '黑胡椒粉 适量', '盐 适量', '生抽 适量', '白醋 适量'], steps:[] },
  { id:25, name:"土豆炖牛腩", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"把牛腩切块凉水下锅，煮开后焯去血沫，过凉水沥干水分备用。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201609/0108/010814143573.jpg", mainIngredients:['牛腩 250克', '土豆 1个', '姜 1片', '大葱 适量', '小葱 适量', '温水 适量'], seasonings:['香叶 1片', '八角 1个', '生抽 适量', '老抽 适量', '料酒 适量', '盐 适量', '鸡精 适量'], steps:['把牛腩切块凉水下锅，煮开后焯去血沫，过凉水沥干水分备用。', '土豆去皮切块，姜切小片，大葱切葱花，小葱切段。', '锅中放适量油烧至五成热，放入葱花和姜片爆出香味。', '再放入牛腩翻炒变色。', '调入适量的生抽、老抽和料酒翻炒均匀。', '添入适量温水没过锅中食材，放入八角和香叶。', '大火煮开后，转中小火炖煮45分钟左，放入土豆块继续炖煮十五分钟左右。', '调入适量的盐和鸡精，撒小葱段大火收汁即可。', '成品图。'] },
  { id:26, name:"南瓜蒸香菇鸡肉", category:"荤菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['南瓜 1个', '鸡胸肉 200g', '水发香菇 150g', '红辣椒 50g', '香葱 适量', '姜 1块'], seasonings:['蚝油 1勺', '料酒 适量', '盐 适量', '生粉 1勺'], steps:[] },
  { id:27, name:"可乐鸡翅", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"将鸡翅洗净，两面切一刀，加入料酒20克，生抽15克，盐2克抓匀腌制20分钟。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201509/1314/131409113297.jpg", mainIngredients:['鸡翅 500克', '可乐 1罐', '葱 10克', '姜 10克', '蒜 10克'], seasonings:['盐 5克', '胡椒粉 5克', '料酒 20克', '鸡粉 3克', '味精 3克', '生抽 25克', '老抽 10克'], steps:['将鸡翅洗净，两面切一刀，加入料酒20克，生抽15克，盐2克抓匀腌制20分钟。', '葱姜蒜洗净，蒜姜切片，葱切葱花', '锅内下30克色拉油，大火将油烧至7成热（即油面有青烟大量上升时为7成热），依次放入腌好的鸡翅，转中火将鸡翅煎至两面金黄，外焦里嫩。', '此时放入葱姜蒜各10克，煸炒出香味。', '放半罐可乐，待可乐烧开加老抽10克，生抽10克，鸡粉3克，盐3克，味精3克，胡椒粉3克，翻炒均匀。', '最后大火收汁，待汤汁浓稠，充分包裹鸡翅后关火。', '撒葱花装饰，一道美味可口，色香味俱全的可乐鸡翅就展现在大家面前了。'] },
  { id:28, name:"冬笋蒸咸肉", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"准备好一块咸肉和冬笋", image:"https://s1.cdn.jiaonizuocai.com/caipu/201903/1610/161015181537.jpg", mainIngredients:['咸肉 150克', '冬笋 140克', '生姜 15克', '黄酒 适量', '香葱 适量'], seasonings:[], steps:['准备好一块咸肉和冬笋', '水开之后，放适量的盐，下冬笋焯煮一下捞出过凉水沥干水分', '冬笋放入盘子里垫底', '咸肉铺在笋的上面', '洗干净去了皮的生姜', '切片', '放在咸肉上面', '加入适量的黄酒', '水开之后，上锅蒸20分钟即可', '撒上适量的香葱', '完成'] },
  { id:29, name:"番茄牛腩", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"牛腩提前清水浸泡，多换水。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201704/2810/281052452334.jpg", mainIngredients:['牛腩 600克', '番茄 6-8只', '干红辣椒 3根', '葱 5克', '姜 5克', '蒜 3瓣', '冰块或冰水 100ml'], seasonings:['八角 2个', '香叶 2片', '花椒 2克', '桂皮 1片', '生抽 2汤匙', '老抽 1汤匙', '料酒 2汤匙', '盐 适量', '冰糖 适量', '黑胡椒 适量', '油 适量'], steps:['牛腩提前清水浸泡，多换水。', '番茄底部划十字，放入沸水中稍煮。', '去皮切块。', '牛腩切成3厘米见方的块状。', '葱白切段，姜切片，蒜去皮，干红辣椒切段，八角、桂皮、花椒、香叶备好。', '牛腩放入冷水锅中，煮沸后再煮2-3分钟，撇去浮沫，捞出沥水。', '铸铁锅加入油，放入牛腩煸去水分。', '加入葱姜蒜炒香。', '加入桂皮、八角、花椒、香叶炒香。', '加入一半番茄块，炒软出水。', '淋料酒、生抽、老抽，加入没过牛腩多一些的热水。', '大火烧开后转小火，加盖，盖上放上冰块。', '锅内蒸气遇到盖内小凸点，冰块使温度下降，冷凝成水珠，最终如雨淋般回落锅中，保留了食材的原汁原味。', '牛腩炖煮45分钟。', '加入剩下的番茄块。', '调入盐、冰糖、黑胡椒，继续炖煮10分钟即可。', '成品图。'] },
  { id:30, name:"红烧鸭肉", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"鸭子反复用冷水浸泡出血水。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201605/1413/141300349728.jpg", mainIngredients:['鸭子 半片', '土豆 3个', '红烧酱汁 30毫升', '姜片 3片', '洋葱 1/3个', '草果 1个', '茴香 若干', '豆蔻 1个', '红辣椒 2只', '香葱 1根'], seasonings:['冰糖 2块', '油 少许', '八角 2粒', '香叶 1片', '盐 1克'], steps:['鸭子反复用冷水浸泡出血水。', '把鸭油去掉一部分，剁成小块。', '食材图。', '锅中倒油，放入冰糖溶化。', '不到翻炒至融化，呈浅褐色。', '倒入调料翻炒出香味。', '加入鸭肉翻炒。', '直到上色。', '加入红烧酱汁。', '翻炒均匀后加入适量水。', '锅开后加入土豆块。', '转小火，加盖子慢炖半小时。', '最后大火收汁加少许盐调味。', '盛到容器里撒上香葱和辣椒碎。'] },
  { id:31, name:"鸭腿肉炖山药土豆", category:"荤菜", cookingTime:"40分钟", difficulty:"中等", description:"鸭腿洗净，土豆，胡萝卜，山药去皮", image:"https://s4.cdn.jiaonizuocai.com/caipu/201607/3022/302219461528.jpg", mainIngredients:['鸭腿 一个', '山药 一根', '土豆 一个', '胡萝卜 半根', '洋葱 一小块', '姜 两片'], seasonings:['油 两勺', '盐 一小勺', '酱油 两勺', '料酒 一勺', '五香粉 三分之一小勺'], steps:['鸭腿洗净，土豆，胡萝卜，山药去皮', '全部切小块', '鸭肉放凉水，煮到水开', '鸭肉盛出备用', '准备洋葱和两片', '热锅下油，油八成热下洋葱和姜爆香', '下五香粉，酱油，料酒', '下土豆，胡萝卜，山药', '翻炒均匀', '加一碗水，加盐，大火烧开，转小火，煮半小时', '收汁', '成品图'] },
  { id:32, name:"蒜香排骨", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"将大蒜拍碎切沫，红椒切沫，青椒切沫。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201509/1516/151609136888.jpg", mainIngredients:['排骨 600克', '大蒜 100克', '红椒 20克', '青椒 20克', '洋葱 10克'], seasonings:['盐 15克', '味精 10克', '鸡粉 10克', '料酒 20克', '白糖 5克', '胡椒粉 10克', '淀粉 50克'], steps:['将大蒜拍碎切沫，红椒切沫，青椒切沫。', '排骨洗净，放入器皿中，加盐15克，味精10克，料酒20克，白糖5克，鸡粉10克，胡椒粉10克，蒜沫100克，拌匀腌制30分钟。', '蒸锅烧热上气，将排骨放入盘中，放蒸锅，中火蒸30分钟，出锅备用。', '将排骨上面的蒜沫去掉，用淀粉50克拌匀。', '锅内下300克色拉油，大火烧至7成热，将排骨炸至金黄色捞出，放入漏勺控油后装盘。', '锅中备少许油，大火烧至7成热，放入洋葱沫60克、红椒沫20克、青椒沫20克大火煸炒。', '煸炒后，撒在装好盘的排骨上即可。'] },
  { id:33, name:"排骨炖豆角", category:"荤菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['豆角 200克', '排骨 100克', '生姜 适量', '温水 适量', '食用油 适量'], seasonings:['蚝油 适量', '酱油 适量', '冰糖 30克', '花椒 10克', '盐 适量'], steps:[] },
  { id:34, name:"水晶猪肉萝卜卷", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"白萝卜去皮切薄片，越薄越好，然后将萝卜片放入碗中，加适量盐轻轻抓匀腌制十分钟。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201901/1320/132054418913.jpg", mainIngredients:['白萝卜 半个', '猪肉 120克', '大葱 10克', '姜 1片', '玉米淀粉 1汤匙', '水淀粉 30克'], seasonings:['蚝油 半汤匙', '盐 适量', '生抽 2汤匙', '料酒 1汤匙', '白胡椒粉 少许', '糖 少许', '鸡蛋清 半个'], steps:['白萝卜去皮切薄片，越薄越好，然后将萝卜片放入碗中，加适量盐轻轻抓匀腌制十分钟。', '选择三肥七瘦的猪肉剁成肉糜，再放入切碎的葱和姜。', '调入一汤匙生抽、料酒、蚝油、白胡椒粉、适量盐和少许糖，搅拌均匀至肉糜上劲儿。', '再放入半个鸡蛋清和一汤匙玉米淀粉，继续搅拌均匀使肉糜呈粘稠状态即可。', '将腌制好的萝卜片冲洗后沥水，取一片萝卜放上适量肉馅卷起来。', '收口朝下摆放盘中，全部做好冷水上锅蒸十分钟，水开后开始计时。', '取出蒸好的萝卜卷，将盘中多余的水分倒入锅中，调入一汤匙生抽煮开，再倒入水淀粉煮至稍微粘稠状态，淋到萝卜猪肉卷上即可。', '最后切点小葱花放到萝卜卷上作为装饰，端上桌食用即可。', '一道营养又美味的水晶猪肉萝卜卷就完成了，有颜值、口感好，您学会了吗？'] },
  { id:35, name:"白萝卜焖鸭肉", category:"荤菜", cookingTime:"30分钟", difficulty:"简单", description:"备好材料。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201606/3021/302111409413.jpg", mainIngredients:['白萝卜 1条', '鸭肉 750克', '蒜头 3粒', '葱 1根'], seasonings:['油 适量', '盐 适量', '生抽 适量', '老抽 1匙', '生粉 1匙', '料酒 1匙'], steps:['备好材料。', '鸭肉洗净，焯水。', '鸭肉切块用油、盐、生抽、老抽、生粉、料酒腌20分钟，白萝卜切块，蒜头拍碎，切葱花。', '热锅凉油，下蒜头爆香。', '倒入鸭肉炒5分钟。', '加入白萝卜继续翻炒5分钟。', '倒入过面清水，调入适量生抽，大火烧开，小火焖25分钟。', '25分钟后，开大火，收汁，即可。', '盛起，撒上葱花，上桌享用吧！'] },
  { id:36, name:"芝麻蔬菜沙拉", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"准备各种蔬菜（自己喜欢什么就放什么吧），该洗的清洗干净，该切的切，该焯水的焯水。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201609/0719/071909441653.jpg", mainIngredients:['蔬菜 适量', '沙拉酱 适量', '熟芝麻 适量'], seasonings:[], steps:['准备各种蔬菜（自己喜欢什么就放什么吧），该洗的清洗干净，该切的切，该焯水的焯水。', '生菜撕一下铺底，放点圣女果。', '将紫甘蓝，土豆，西兰花放入图3的容器里（这些需要焯水哦）。', '再放一点圣女果和黄瓜片，撒上熟芝麻。', '挤上沙拉酱，开始我的减肥晚餐~'] },
  { id:37, name:"黑椒牛排炒蘑菇", category:"素菜", cookingTime:"40分钟", difficulty:"中等", description:"准备材料如图。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201808/1420/142021248473.jpg", mainIngredients:['黑椒牛排 100克', '蘑菇 100克', '胡萝卜 80克'], seasonings:['盐 适量', '淀粉 适量'], steps:['准备材料如图。', '将牛排切条，胡萝卜和蘑菇切片。', '烧沸水，将蘑菇焯水2分钟后捞出沥干水份备用。', '热锅倒油烧至八成热。', '放入牛排快速翻炒至变色。', '放入胡萝卜翻炒10秒。', '放入蘑菇翻炒20秒。', '放入盐翻炒10秒。', '倒入适量蚝油翻炒10秒即可关火。', '风味独特。', '好吃营养！'] },
  { id:38, name:"红烧豆腐", category:"素菜", cookingTime:"40分钟", difficulty:"中等", description:"豆腐切厚块", image:"", mainIngredients:['豆腐 一块', '肉末 30克', '葱 3克', '姜 2片', '蒜 2瓣'], seasonings:['盐 2勺', '糖 1勺', '生抽 3勺', '老抽 1勺'], steps:['豆腐切厚块', '切条', '切两公分小块', '锅中倒入清水', '开大火', '撒一勺盐', '煮沸', '煮两分钟', '捞出豆腐装盘沥干备用', '肉末倒入一勺淀粉', '搅拌均匀', '开大火锅中倒入油', '倒入葱姜蒜爆炒', '倒入肉末', '煸炒肉末', '倒入料酒继续煸炒后盛入碗里', '另起一锅', '倒入剩下的油', '煎豆腐', '煎至金黄', '晃动锅子，让豆腐翻身', '均匀倒入肉末', '倒入老抽', '倒入生抽', '翻炒均匀', '撒一勺盐', '倒入少量清水', '再撒一勺白糖', '翻炒均匀', '小火慢炖', '勾芡汁，炒均收汁即可', '撒葱花', '一道美味的红烧豆腐做好了', '我是普木，一起来香哈交流吧'] },
  { id:39, name:"锅塌豆腐", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"将豆腐顶刀切成约1厘米厚的片，放入盘中备用。鸡蛋打入碗中，搅拌均匀。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201606/2015/201546244757.jpg", mainIngredients:['豆腐 300克', '鸡蛋 150克。', '葱 5克', '姜 5克', '蒜 5克', '香菜 10克'], seasonings:['盐 5克', '味精 3克', '鸡汁 10克', '白糖 5克', '淀粉 20克', '香油 5克', '料酒 10克', '胡椒粉 3克。'], steps:['将豆腐顶刀切成约1厘米厚的片，放入盘中备用。鸡蛋打入碗中，搅拌均匀。', '葱、姜、蒜、香菜切沫备用。', '倒入15克油大火烧至五六成。', '把切好的豆腐片沾满均匀的淀粉，之后粘上蛋液下入锅中，减至两面金黄，倒入漏勺备用。', '锅中留少许油，烧热后加入葱姜蒜爆香。', '放入料酒，加入清水250克左右，然后放入盐、味精、鸡汁、白糖、胡椒粉。', '放入豆腐片大火烧制，转中火烧2分钟。之后大火收汁，淋入香油。', '盛出装盘，撒上香菜。这道美味的锅塌豆腐就做好了。'] },
  { id:40, name:"双椒蘑菇", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"准备好食材", image:"https://s1.cdn.jiaonizuocai.com/caipu/201701/2009/200911423596.jpg", mainIngredients:['蘑菇 150g', '青椒 两个', '红椒 半个', '姜蒜片 5g'], seasonings:['酱油 10ml左右', '盐 少许'], steps:['准备好食材', '蘑菇洗干净，撕小块，姜蒜切片，红椒青椒切任意形状', '锅里烧油，油热了放入姜蒜片爆香', '放入蘑菇翻炒，翻炒出汁', '蘑菇快要熟的时候放入青椒红椒，倒入酱油', '加少许盐，翻炒均匀起锅', '起锅装盘', '完成'] },
  { id:41, name:"果实类蔬菜的清洗和处理", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['无'], seasonings:[], steps:[] },
  { id:42, name:"家常豆腐", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"将豆腐切成6厘米长、4厘米宽、0.4厘米厚的片", image:"https://s1.cdn.jiaonizuocai.com/caipu/201606/2220/22204105573.jpg", mainIngredients:['豆腐 500g', '木耳 50g', '青椒 1个', '红椒 1个', '青蒜 10g', '大葱 10g', '姜 10g'], seasonings:['料酒 15g', '老抽 15g', '盐 5g', '白糖 3g', '豆瓣酱 10g', '鸡粉 3g', '淀粉 10g'], steps:['将豆腐切成6厘米长、4厘米宽、0.4厘米厚的片', '青葱洗净切寸段，葱姜洗净切末', '红辣椒洗净去蒂去筋膜，切块。青椒也同样处理', '木耳泡发后切片', '取小碗，放淀粉10克，加少许清水，调匀备用', '锅内下油15克，待油温烧至7成热，7成热即手放油上有明显的热度时，转中火将豆腐炸至金黄时，将豆腐捞出备用', '在锅中倒入少许油，放入青红椒片，转大火翻炒', '将锅内青红椒片倒出备用，同时放入豆瓣酱，加入葱姜蒜，将炸好的豆腐放入，翻炒均匀后将木耳倒入锅中，用水淀粉进行勾芡', '倒入青红椒片，翻炒至青椒断生后，转小火继续煮片刻即可出锅装盘', '成品图'] },
  { id:43, name:"鲜虾豆腐", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"烧一锅开水，将虾煮熟，捞出冲凉", image:"https://s4.cdn.jiaonizuocai.com/caipu/201604/1115/111524307402.jpg", mainIngredients:['鲜虾 400克', '豆腐 500克', '姜 10克', '葱 10克'], seasonings:['盐 5克', '味精 3克', '胡椒粉 1克', '糖 3克'], steps:['烧一锅开水，将虾煮熟，捞出冲凉', '再把虾去头去壳，留头备用，虾从背后开刀，把虾线挑出', '再把豆腐切成小方块，姜葱切碎', '大火热锅，锅中下油10克，把姜和留好的虾头煎一下，中火煎出香味', '加入500克水大火煲5分钟，捞出虾头', '把虾肉和豆腐倒入，煲开后，加入盐5克，味精3克，胡椒粉1克，糖3克，大火煮一分钟后出锅', '装盘，撒上葱花'] },
  { id:44, name:"培根蔬菜粥", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['大米 100克', '培根 两片', '玉米粒 20克', '胡萝卜 30克', '食用油 适量'], seasonings:['水 适量'], steps:[] },
  { id:45, name:"酥炸椒盐蘑菇", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"蘑菇冲洗干净，撕成小块，锅烧开水，放水里一勺盐，放入蘑菇焯软，捞出放凉水过凉", image:"https://s1.cdn.jiaonizuocai.com/caipu/201602/1917/19175252387.jpg", mainIngredients:['蘑菇 500克', '鸡蛋 两个', '面粉 适量', '食用油 适量'], seasonings:['盐 适量', '花椒粉 适量'], steps:['蘑菇冲洗干净，撕成小块，锅烧开水，放水里一勺盐，放入蘑菇焯软，捞出放凉水过凉', '把蘑菇捞出，用手攥干水分', '放一盆里，放盐，花椒粉，拌匀', '取一小盆，打入鸡蛋', '把鸡蛋打散，再加些面粉，在加一点水活成稀蛋糊', '取一片蘑菇放蛋糊里，试试能不能挂上糊，如果稀了就在加点面粉搅匀', '锅热油，把蘑菇逐个裹上蛋糊，放入油中，中小火炸制微微金黄', '捞出装盘'] },
  { id:46, name:"黑椒芦笋炒蘑菇", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"我是糯米baby,来香哈一起交流吧！", image:"", mainIngredients:['芦笋 200g', '蘑菇 六七个', '黄油 20g', '蒜 10g'], seasonings:['黑胡椒 适量', '盐 一茶匙'], steps:['我是糯米baby,来香哈一起交流吧！'] },
  { id:47, name:"肉片炒蘑菇", category:"素菜", cookingTime:"40分钟", difficulty:"中等", description:"蘑菇洗净，撕成条", image:"https://s4.cdn.jiaonizuocai.com/caipu/201801/1113/111309075834.jpg", mainIngredients:['猪肉 150克', '蘑菇 500克', '葱 适量', '姜 适量'], seasonings:['醋 少许', '盐 适量', '酱油 适量', '八角 一瓣', '花生油 适量'], steps:['蘑菇洗净，撕成条', '猪肉切片，葱姜切沫，准备一瓣八角', '起锅烧热，放花生油，放入肉片翻炒至出油', '放入葱姜和八角爆香', '淋入适量酱油', '翻炒均匀', '放入蘑菇翻炒', '炒至蘑菇出汤，可以盖锅盖稍微焖几分钟', '汤汁收到剩三分之一，放盐调味', '淋入少许醋', '炒匀即可出锅', '美味的肉片炒蘑菇就做好了，我是踏雪寻萍，来香哈一起交流吧！'] },
  { id:48, name:"西红柿烧豆腐", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"首先将豆腐先用顺刀切成2厘米厚的片，然后再用顶刀片成2厘米的长条，放入碗中备用", image:"https://s1.cdn.jiaonizuocai.com/caipu/201606/1921/192128092972.jpg", mainIngredients:['豆腐 500g', '西红柿 50g', '葱 10g', '姜 10g', '蒜 10g', '香菜 10g'], seasonings:['盐 10g', '味精 10g', '鸡粉 10g', '番茄酱 10g', '白糖 10g', '料酒 10g', '生抽 10g'], steps:['首先将豆腐先用顺刀切成2厘米厚的片，然后再用顶刀片成2厘米的长条，放入碗中备用', '西红柿切成小块备用', '葱姜切成末，蒜切片，香菜切成段备用', '在锅中倒入清水，转大火烧开，将切好的豆腐条焯水后捞出备用', '待锅烧热后下入10克色拉油，放入切好的葱姜末，蒜片进行炒香', '然后把切好的西红柿块转大火煸炒', '接下来将准备好的番茄酱进行炒香，再依次放入准备好的料酒、生抽、加入清水100克，备好的豆腐条', '同时放入准备好的盐、味精、鸡粉、白糖、胡椒，转大火烧开后转小火炖至5分钟', '5分钟后出锅装盘，撒入切好的香菜进行装饰即可'] },
  { id:49, name:"香菇酱酿豆腐", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['肉馅 100克', '豆腐 300克', '香菇酱 2大勺', '豌豆 适量'], seasonings:['料酒 半勺', '生抽 2勺', '盐 适量', '糖 半勺', '淀粉 半勺'], steps:[] },
  { id:50, name:"果实类蔬菜的种类和挑选", category:"素菜", cookingTime:"15分钟", difficulty:"简单", description:"", image:"", mainIngredients:['无'], seasonings:[], steps:[] },
  { id:51, name:"豆腐焖茄子", category:"素菜", cookingTime:"40分钟", difficulty:"中等", description:"将茄子去皮切成片，然后改刀抹成小块，装盘备用。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201509/1316/131647161294.jpg", mainIngredients:['豆腐 300克', '茄子 300克', '五花肉 25克', '葱 10克', '姜 10克', '蒜 10克', '尖椒 15克', '红椒 15克', '大料 2颗'], seasonings:['盐 10克', '味精 5克', '白糖 5克', '蚝油 15克', '老抽 5克', '胡椒粉 5克', '鸡粉 10克', '料酒 10克', '淀粉 5克'], steps:['将茄子去皮切成片，然后改刀抹成小块，装盘备用。', '豆腐从中间切开，然后顶刀切成2厘米厚的薄片备用。', '五花肉洗净顶刀切片。', '葱、姜、蒜切沫；尖椒、红椒切成菱形片。', '热锅下油大火烧至六七成热，放入豆腐拉下油捞出备用；', '然后放入茄子块中火炸透，捞出备用。', '热锅下油放入大料爆香，加入五花肉煸炒。', '加入葱姜蒜、蚝油、老抽煸香；', '加入料酒、清水、豆腐、茄块、盐、味精、白糖、鸡粉和胡椒粉烧开转中火，盖盖儿焖5分钟。', '用水淀粉勾芡，放入尖椒和红椒盖盖儿焖1分钟。', '一道美味可口的豆腐焖茄子就展现在大家面前了。'] },
  { id:52, name:"青豆炒蘑菇", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"准备材料如图。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201808/1420/142028293479.jpg", mainIngredients:['青豆 80克', '蘑菇 100克', '火腿肠 1根', '大蒜 1瓣'], seasonings:['盐 适量'], steps:['准备材料如图。', '将青豆煮5-8分钟后捞出沥干水份备用。', '将蘑菇和火腿肠切小颗粒，大蒜切片。', '热锅倒油烧至八成热。', '放入大蒜片翻炒5秒。', '放入蘑菇小火翻炒3分钟。', '放入青豆和火腿肠翻炒1分钟。', '放入适量盐翻炒10秒即可关火。', '做法简单！', '好吃下饭！'] },
  { id:53, name:"猪排骨胡萝卜蔬菜粥", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"准备所需食材。", image:"https://s1.cdn.jiaonizuocai.com/caipu/201609/2721/272107264946.jpg", mainIngredients:['猪排骨 300克', '大米 250克', '胡萝卜 适量', '蔬菜 适量'], seasonings:['盐 适量', '鸡精 适量', '胡椒粉 适量'], steps:['准备所需食材。', '猪排斩块洗净，胡萝卜切小丁，蔬菜切小段备用。', '猪排入沸水锅焯一下，去除血水，洗净。', '锅里水开放入洗净的猪排、大米，以大火煮沸转小火慢煮15分。（煮至大米有点开花）再放入胡萝卜煮10分钟，接着放入蔬菜、调入辅料搅匀煮片刻即可。', '成品。', '成品。'] },
  { id:54, name:"腊肠蔬菜炒饭", category:"素菜", cookingTime:"30分钟", difficulty:"简单", description:"准备好腊肠、葱、圣女果、蔬菜组合待用。", image:"https://s4.cdn.jiaonizuocai.com/caipu/201902/1518/151805289257.jpg", mainIngredients:['米饭 1碗', '圣女果 10粒', '蔬菜 1把', '葱 1段', '腊肠 1根'], seasonings:['油 5克', '盐 3克', '生抽 1勺'], steps:['准备好腊肠、葱、圣女果、蔬菜组合待用。', '锅中放入油，加入香肠翻炒。', '再放入葱末翻炒。（注意小火，忽略我几片火大的香肠：()', '再放入蔬菜翻炒，放入盐、生抽。', '加入米饭，将米饭捣碎翻炒均匀。', '一锅色香味俱全的炒饭可以出锅了。', '翻炒不易过狠，保持圣女果的原型，卖相还不错！'] },

// ============ Helpers ============
function getTodayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDateCN(dateStr) {
  var parts = dateStr.split('-');
  var y = +parts[0], m = +parts[1], d = +parts[2];
  var w = ['日','一','二','三','四','五','六'][new Date(y, m-1, d).getDay()];
  return y + '年' + m + '月' + d + '日 星期' + w;
}
function getMonthDays(year, month) {
  return new Date(year, month+1, 0).getDate();
}

// ============ localStorage ============
var STORAGE_KEY = 'daily_recipes_data';
function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { history:{}, theme:'default', viewedDate:null };
  } catch(e) { return { history:{}, theme:'default', viewedDate:null }; }
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

// ============ shuffle helpers ============
function seededRandom(seed) {
  var s = 0;
  for (var i=0; i<seed.length; i++) s = ((s<<5)-s+seed.charCodeAt(i))|0;
  return function() { s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
}
function shuffle(arr, rng) {
  var a = arr.slice();
  for (var i=a.length-1; i>0; i--) { var j=Math.floor(rng()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

    var dates = Object.keys(data.history).sort().slice(-7);
    dates.forEach(function(d) { data.history[d].forEach(function(id) { recentIds.add(id); }); });
    pool = RECIPES.filter(function(r) { return !recentIds.has(r.id); });
    if (pool.length < 6) pool = RECIPES.slice();
  } else {
    pool = available;
  }

  var rng = useRandom ? function() { return Math.random(); } : seededRandom(dateStr);

  var meat = shuffle(pool.filter(function(r) { return r.category==='荤菜'; }), rng);
  var veg = shuffle(pool.filter(function(r) { return r.category==='素菜'; }), rng);
  var soup = shuffle(pool.filter(function(r) { return r.category==='汤'; }), rng);
  var selected = meat.slice(0,3).concat(veg.slice(0,2)).concat(soup.slice(0,1));

  if (selected.length < 6) {
    var selIds = new Set(selected.map(function(r) { return r.id; }));
    var remaining = shuffle(pool.filter(function(r) { return !selIds.has(r.id); }), rng);
    while (selected.length < 6 && remaining.length > 0) selected.push(remaining.shift());
  }
  var recipeIds = selected.map(function(r) { return r.id; });
  data.history[dateStr] = recipeIds;
  saveData(data);
  return recipeIds;
}

// ============ Emoji Icons ============
function getRecipeIcon(r) {
  var n = r.name;
  if (n.indexOf('鸡')!==-1 || n.indexOf('翅')!==-1) return '🍗';
  if (n.indexOf('鱼')!==-1 || n.indexOf('鲈')!==-1) return '🐟';
  if (n.indexOf('虾')!==-1) return '🦐';
  if (n.indexOf('牛')!==-1) return '🥩';
  if (n.indexOf('羊')!==-1) return '🍖';
  if (n.indexOf('鸭')!==-1) return '🦆';
  if (n.indexOf('排骨')!==-1 || n.indexOf('骨')!==-1) return '🍖';
  if (n.indexOf('肉')!==-1 || n.indexOf('猪')!==-1 || n.indexOf('宫保')!==-1 || n.indexOf('回锅')!==-1 || n.indexOf('鱼香')!==-1 || n.indexOf('锅包')!==-1 || n.indexOf('京酱')!==-1 || n.indexOf('水煮')!==-1 || n.indexOf('蒜香')!==-1 || n.indexOf('孜然')!==-1) return '🥘';
  if (n.indexOf('豆腐')!==-1 && r.category==='荤菜') return '🧈';
  if (n.indexOf('四季豆')!==-1) return '🫛';
  if (n.indexOf('蛋')!==-1) return '🍳';
  if (n.indexOf('豆腐')!==-1) return '🧈';
  if (n.indexOf('茄')!==-1) return '🍆';
  if (n.indexOf('土豆')!==-1) return '🥔';
  if (n.indexOf('玉米')!==-1) return '🌽';
  if (n.indexOf('西兰花')!==-1 || n.indexOf('青菜')!==-1 || n.indexOf('菜心')!==-1 || n.indexOf('生菜')!==-1 || n.indexOf('包菜')!==-1 || n.indexOf('白菜')!==-1 || n.indexOf('空心菜')!==-1 || n.indexOf('菜')!==-1 || n.indexOf('芹')!==-1) return '🥬';
  if (n.indexOf('黄瓜')!==-1 || n.indexOf('丝瓜')!==-1 || n.indexOf('冬瓜')!==-1 || n.indexOf('南瓜')!==-1 || n.indexOf('苦瓜')!==-1) return '🥒';
  if (n.indexOf('菇')!==-1 || n.indexOf('菌')!==-1) return '🍄';
  if (n.indexOf('辣椒')!==-1 || n.indexOf('青椒')!==-1 || n.indexOf('辣')!==-1) return '🌶️';
  if (n.indexOf('花菜')!==-1) return '🥦';
  if (n.indexOf('萝卜')!==-1) return '🥕';
  if (n.indexOf('山药')!==-1) return '🥔';
  if (n.indexOf('汤')!==-1 && r.category==='汤') return '🍲';
  if (r.category==='荤菜') return '🍖';
  if (r.category==='素菜') return '🥬';
  return '🍲';
}

// ============ Render ============
function renderRecipes(recipeIds, targetDateStr) {
  var grid = document.getElementById('recipeGrid');
  var heading = document.getElementById('dateHeading');
  var subtitle = document.getElementById('dailySubtitle');
  var dateBadge = document.getElementById('dateBadge');
  var isToday = targetDateStr === getTodayStr();
  heading.textContent = isToday ? '今日推荐 · 5菜1汤' : formatDateCN(targetDateStr);
  subtitle.textContent = isToday ? '每天新鲜搭配，好好吃饭' : '历史食谱回顾';
  dateBadge.textContent = formatDateCN(targetDateStr);

  var recipes = recipeIds.map(function(id) { return RECIPES.find(function(r) { return r.id===id; }); }).filter(Boolean);
  if (recipes.length===0) {
    grid.innerHTML = '<p style="text-align:center;width:100%;color:var(--text-light);padding:40px;">暂无食谱数据</p>';
    return;
  }
  var catClass = { '荤菜':'cat-meat', '素菜':'cat-veg', '汤':'cat-soup' };

  function makeCard(r) {
    return '<div class="recipe-card ' + (r.category==='汤'?'soup-card':'') + '" data-recipe-id="' + r.id + '">'
      + '<div class="card-img-wrap">'
      + (r.image ? '<img class="card-img" src="' + r.image + '" alt="' + r.name + '" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">' : '')
      + '<span class="card-icon" style="' + (r.image ? 'display:none' : '') + '">' + getRecipeIcon(r) + '</span>'
      + '<span class="card-category ' + (catClass[r.category]||'') + '">' + r.category + '</span>'
      + '</div>'
      + '<div class="card-body">'
      + '<div class="card-name">' + r.name + '</div>'
      + '<div class="card-desc">' + r.description + '</div>'
      + '<div class="card-meta"><span>⏱ ' + r.cookingTime + '</span><span>📊 ' + r.difficulty + '</span></div>'
      + '</div>'
      + '<div class="card-expand">'
      + '<h4>主料</h4><ul>' + r.mainIngredients.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
      + '<h4>调料</h4><ul>' + r.seasonings.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
      + '<h4>做法</h4><ol>' + r.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>'
      + '</div>'
      + '<div class="card-toggle" onclick="toggleCard(this)">展开查看详情 ▾</div>'
      + '</div>';
  }

  var numCols = window.innerWidth <= 640 ? 1 : window.innerWidth <= 1024 ? 2 : 3;
  var cols = [[], [], []];
  recipes.forEach(function(r, i) { cols[i % numCols].push(r); });

  grid.innerHTML = cols.map(function(col, ci) {
    var cls = 'recipe-col col' + (ci + 1);
    return '<div class="' + cls + '">' + col.map(function(r) { return makeCard(r); }).join('') + '</div>';
  }).join('');

  grid.querySelectorAll('.recipe-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.card-toggle')) return;
      var toggle = this.querySelector('.card-toggle');
      if (toggle) toggleCard(toggle);
    });
  });
}
function toggleCard(el) {
  var card = el.closest('.recipe-card');
  card.classList.toggle('expanded');
  var expanded = card.classList.contains('expanded');
  el.textContent = expanded ? '收起详情 ▴' : '展开查看详情 ▾';
  if (expanded) {
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function updateButtonVisibility(displayDate) {
  var isToday = displayDate === getTodayStr();
  document.getElementById('todayBtn').style.display = isToday ? 'none' : 'inline-block';
  document.getElementById('refreshBtn').style.display = isToday ? 'inline-block' : 'none';
}

// ============ Theme ============
function applyTheme(theme) {
  if (theme==='default') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-dot').forEach(function(d) {
    d.classList.toggle('active', d.dataset.theme===theme);
  });
  var data = loadData(); data.theme = theme; saveData(data);
}

// ============ Calendar ============
var calYear, calMonth, calSelectedDate;
function openCalendar() {
  var today = new Date();
  calYear = today.getFullYear(); calMonth = today.getMonth(); calSelectedDate = getTodayStr();
  document.getElementById('calOverlay').classList.add('active');
  renderCalendar();
}
function closeCalendar() { document.getElementById('calOverlay').classList.remove('active'); }

function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = calYear + '年 ' + (calMonth+1) + '月';
  var now = new Date();
  document.getElementById('calNext').disabled = (calYear===now.getFullYear() && calMonth>=now.getMonth());

  var grid = document.getElementById('calGrid');
  var todayStr = getTodayStr();
  var data = loadData();
  var html = ['日','一','二','三','四','五','六'].map(function(h) { return '<div class="cal-day-header">' + h + '</div>'; }).join('');
  var firstDay = new Date(calYear, calMonth, 1).getDay();
  var daysInMonth = getMonthDays(calYear, calMonth);
  var prevDays = getMonthDays(calYear, calMonth-1);

  for (var i=firstDay-1; i>=0; i--) html += '<div class="cal-day other-month">' + (prevDays-i) + '</div>';
  for (var d=1; d<=daysInMonth; d++) {
    var ds = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var cls = 'cal-day';
    if (ds===todayStr) cls += ' today';
    if (data.history[ds]) cls += ' has-recipe';
    if (ds>todayStr) cls += ' future';
    if (ds===calSelectedDate) cls += ' selected';
    html += '<div class="' + cls + '" data-date="' + ds + '" onclick="onCalDayClick(\'' + ds + '\',this)">' + d + '</div>';
  }
  var remaining = 42 - (firstDay + daysInMonth);
  for (var d2=1; d2<=remaining; d2++) html += '<div class="cal-day other-month">' + d2 + '</div>';
  grid.innerHTML = html;
}

function onCalDayClick(dateStr, el) {
  if (el && (el.classList.contains('future')||el.classList.contains('other-month'))) return;
  calSelectedDate = dateStr;
  document.querySelectorAll('.cal-day').forEach(function(d) { d.classList.remove('selected'); });
  if (el) el.classList.add('selected');
  var data = loadData();
  var recipeIds = data.history[dateStr];
  // auto-generate for past dates without history using date-seeded shuffle
  if ((!recipeIds||recipeIds.length===0) && dateStr < getTodayStr()) {
    recipeIds = selectRecipesForDate(dateStr, data);
    renderCalendar(); // refresh dots
  }
  var div = document.getElementById('calRecipes');
  if (!recipeIds||recipeIds.length===0) {
    div.innerHTML = '<p style="color:var(--text-light);text-align:center;padding:20px 0;">' + (dateStr===getTodayStr()?'今天还没有生成食谱，请回到首页查看':'该日期暂无食谱记录') + '</p>';
    return;
  }
  var recipes = recipeIds.map(function(id) { return RECIPES.find(function(r) { return r.id===id; }); }).filter(Boolean);
  var badgeMap = {'荤菜':'cat-meat','素菜':'cat-veg','汤':'cat-soup'};
  div.innerHTML = '<h4>' + formatDateCN(dateStr) + ' 的食谱</h4>'
    + recipes.map(function(r) { return '<div class="cal-recipe-item" onclick="viewHistoricalRecipe(\'' + dateStr + '\')"><span class="cal-recipe-badge ' + (badgeMap[r.category]||'') + '">' + r.category + '</span><span class="cal-recipe-name">' + r.name + '</span><span style="margin-left:auto;font-size:12px;color:var(--text-light);">' + r.cookingTime + '</span></div>'; }).join('')
    + '<p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-light);">点击食谱可回到首页查看完整详情</p>';
}

function viewHistoricalRecipe(dateStr) {
  var data = loadData();
  var recipeIds = data.history[dateStr];
  if (!recipeIds) return;
  data.viewedDate = dateStr; saveData(data);
  closeCalendar();
  renderRecipes(recipeIds, dateStr);
  updateButtonVisibility(dateStr);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============ Refresh & Navigation ============
function refreshToday() {
  var data = loadData();
  var todayStr = getTodayStr();
  delete data.history[todayStr];
  data.viewedDate = null;
  saveData(data);
  // Use random shuffle (not date-seeded) so each click gives different recipes
  var recipeIds = selectRecipesForDate(todayStr, data, true);
  renderRecipes(recipeIds, todayStr);
  document.getElementById('todayBtn').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function goToToday() {
  var data = loadData();
  data.viewedDate = null; saveData(data);
  var todayStr = getTodayStr();
  var recipeIds = selectRecipesForDate(todayStr, data);
  renderRecipes(recipeIds, todayStr);
  document.getElementById('todayBtn').style.display = 'none';
  document.getElementById('refreshBtn').style.display = 'inline-block';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ============ Search ============
var searchTimer = null;
var searchHistoryHideTimer = null;

function loadSearchHistory() {
  try {
    var raw = localStorage.getItem('recipeSearchHistory');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveSearchHistory(query) {
  var history = loadSearchHistory();
  history = history.filter(function(h) { return h.query !== query; });
  history.unshift({ query: query, time: Date.now() });
  if (history.length > 5) history = history.slice(0, 5);
  try { localStorage.setItem('recipeSearchHistory', JSON.stringify(history)); } catch(e) {}
}

function showSearchHistory() {
  var history = loadSearchHistory();
  var el = document.getElementById('searchHistory');
  if (!history.length) { el.classList.remove('show'); return; }
  var now = Date.now();
  el.innerHTML = '<div class="search-history-header"><span>最近搜索</span><button onclick="clearSearchHistory()">清除记录</button></div>'
    + history.map(function(h) {
        var diff = now - h.time;
        var timeStr = diff < 60000 ? '刚刚' : diff < 3600000 ? Math.floor(diff/60000) + '分钟前'
          : diff < 86400000 ? Math.floor(diff/3600000) + '小时前' : Math.floor(diff/86400000) + '天前';
        return '<div class="search-history-item" data-query="' + escHtml(h.query) + '"><span class="shi-icon">🕐</span>' + escHtml(h.query) + '<span class="shi-time">' + timeStr + '</span></div>';
      }).join('');
  el.querySelectorAll('.search-history-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var q = this.getAttribute('data-query');
      document.getElementById('searchInput').value = q;
      el.classList.remove('show');
      performSearch(q);
    });
  });
  el.classList.add('show');
}

function hideSearchHistory() {
  searchHistoryHideTimer = setTimeout(function() {
    document.getElementById('searchHistory').classList.remove('show');
  }, 200);
}

function clearSearchHistory() {
  try { localStorage.removeItem('recipeSearchHistory'); } catch(e) {}
  document.getElementById('searchHistory').classList.remove('show');
}

function performSearch(query) {
  if (!query||query.trim().length===0) { closeSearch(); return; }
  var q = query.trim().toLowerCase();
  var results = RECIPES.filter(function(r) {
    if (r.name.toLowerCase().indexOf(q)!==-1) return true;
    if (r.description.toLowerCase().indexOf(q)!==-1) return true;
    var allIngs = r.mainIngredients.concat(r.seasonings).join(' ').toLowerCase();
    if (allIngs.indexOf(q)!==-1) return true;
    if (r.category.indexOf(q)!==-1) return true;
    return false;
  });
  results.sort(function(a, b) {
    var aName = a.name.toLowerCase().indexOf(q)!==-1;
    var bName = b.name.toLowerCase().indexOf(q)!==-1;
    if (aName && !bName) return -1;
    if (!aName && bName) return 1;
    return 0;
  });
  showSearchPanel(results, q);
}

function showSearchPanel(results, query) {
  var overlay = document.getElementById('searchOverlay');
  var panel = document.getElementById('searchPanel');
  overlay.classList.add('active');
  if (results.length===0) {
    panel.innerHTML = '<div class="search-panel-header"><h3>搜索结果</h3><button class="search-panel-close" onclick="closeSearch()">✕</button></div>'
      + '<div class="search-empty">没有找到包含 "<b>' + escHtml(query) + '</b>" 的菜谱</div>';
    return;
  }
  var catClass = { '荤菜':'cat-meat', '素菜':'cat-veg', '汤':'cat-soup' };
  panel.innerHTML = '<div class="search-panel-header"><h3>找到 ' + results.length + ' 个菜谱</h3><button class="search-panel-close" onclick="closeSearch()">✕</button></div>'
    + results.map(function(r) {
      return '<div class="search-result-item" data-id="' + r.id + '">'
        + '<span class="sri-icon">' + getRecipeIcon(r) + '</span>'
        + '<div class="sri-info">'
        + '<div class="sri-name">' + highlightMatch(r.name, query) + ' <span class="card-category ' + (catClass[r.category]||'') + '" style="font-size:11px;vertical-align:middle;">' + r.category + '</span></div>'
        + '<div class="sri-desc">' + escHtml(r.description) + '</div>'
        + '<div class="sri-meta"><span>⏱ ' + r.cookingTime + '</span><span>📊 ' + r.difficulty + '</span></div>'
        + '</div></div>';
    }).join('');
  panel.querySelectorAll('.search-result-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var id = parseInt(this.dataset.id);
      var recipe = RECIPES.find(function(r) { return r.id===id; });
      if (recipe) { saveSearchHistory(recipe.name); showRecipeDetail(recipe); }
    });
  });
}

function highlightMatch(text, query) {
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx===-1) return escHtml(text);
  return escHtml(text.slice(0,idx)) + '<b style="color:var(--primary);">' + escHtml(text.slice(idx,idx+query.length)) + '</b>' + escHtml(text.slice(idx+query.length));
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showRecipeDetail(recipe) {
  var panel = document.getElementById('searchPanel');
  var catClass = { '荤菜':'cat-meat', '素菜':'cat-veg', '汤':'cat-soup' };
  panel.innerHTML = '<div class="search-detail">'
    + '<span class="sd-back" onclick="backToSearchResults()">← 返回搜索结果</span>'
    + '<div class="sd-name">' + getRecipeIcon(recipe) + ' ' + recipe.name + ' <span class="card-category ' + (catClass[recipe.category]||'') + '" style="font-size:12px;vertical-align:middle;">' + recipe.category + '</span></div>'
    + '<div class="sd-desc">' + recipe.description + '</div>'
    + '<div class="sd-meta"><span>⏱ ' + recipe.cookingTime + '</span><span>📊 ' + recipe.difficulty + '</span></div>'
    + '<h4>主料</h4><ul>' + recipe.mainIngredients.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
    + '<h4>调料</h4><ul>' + recipe.seasonings.map(function(i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'
    + '<h4>做法</h4><ol>' + recipe.steps.map(function(s) { return '<li>' + s + '</li>'; }).join('') + '</ol>'
    + '</div>';
  panel.scrollTop = 0;
}

function backToSearchResults() {
  var input = document.getElementById('searchInput');
  if (input.value.trim()) {
    performSearch(input.value);
  } else {
    closeSearch();
  }
}

function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('active');
  document.getElementById('searchInput').value = '';
}

// ============ Init ============
function init() {
  var data = loadData();
  var todayStr = getTodayStr();
  applyTheme(data.theme);

  // auto-finalize yesterday's recipe (11:59 PM rule)
  var yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  var yStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2,'0') + '-' + String(yesterday.getDate()).padStart(2,'0');
  if (!data.history[yStr]) {
    selectRecipesForDate(yStr, data);
  }

  var displayDate = todayStr;
  if (data.viewedDate && data.viewedDate !== todayStr) {
    displayDate = data.viewedDate;
  }

  var recipeIds = selectRecipesForDate(displayDate, data);
  renderRecipes(recipeIds, displayDate);
  updateButtonVisibility(displayDate);

  document.querySelectorAll('.theme-dot').forEach(function(dot) {
    dot.addEventListener('click', function() { applyTheme(this.dataset.theme); });
  });
  document.getElementById('calBtn').addEventListener('click', openCalendar);
  document.getElementById('calClose').addEventListener('click', closeCalendar);
  document.getElementById('calOverlay').addEventListener('click', function(e) { if(e.target===this) closeCalendar(); });
  document.getElementById('calPrev').addEventListener('click', function() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', function() {
    var now = new Date();
    if (calYear===now.getFullYear() && calMonth>=now.getMonth()) return;
    calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar();
  });
  document.getElementById('todayBtn').addEventListener('click', goToToday);
  document.getElementById('refreshBtn').addEventListener('click', refreshToday);
  // search
  document.getElementById('searchInput').addEventListener('input', function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() { performSearch(this.value); }.bind(this), 250);
  });
  document.getElementById('searchInput').addEventListener('focus', function() {
    clearTimeout(searchHistoryHideTimer);
    if (this.value.trim()) { performSearch(this.value); }
    else { showSearchHistory(); }
  });
  document.getElementById('searchInput').addEventListener('blur', function() {
    hideSearchHistory();
  });
  document.getElementById('searchInput').addEventListener('click', function() {
    clearTimeout(searchHistoryHideTimer);
    if (!this.value.trim()) showSearchHistory();
  });
  document.getElementById('searchOverlay').addEventListener('click', function(e) {
    if (e.target===this) closeSearch();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key==='Escape') { closeSearch(); closeCalendar(); }
  });
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
